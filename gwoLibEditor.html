<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GWO Editor Pipeline | Chintan Vadgama</title>
    
    <link href="https://cdn.quilljs.com/1.3.6/quill.core.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');

        /* --- Color Palette & Variables (Matched to index.html) --- */
        :root {
            --bg-main: #05090d;
            --bg-card: #0a1117;
            --bg-card-hover: #111a22;
            --border-color: rgba(255, 255, 255, 0.08);
            
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --text-dark: #64748b;
            
            --sectionTitle: #82f0cf;
            --accent: #38d9a9;
            --accent-hover: #72dfbe;
            --accent-transparent: rgba(56, 217, 169, 0.15);
            
            --danger: #ef4444;
            --success: #38d9a9;

            --transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            line-height: 1.6;
        }

        /* --- Header & Layout Controls --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            z-index: 100;
            height: 70px;
            flex-shrink: 0;
        }

        h1 {
            font-weight: 600;
            letter-spacing: 1.5px;
            color: var(--sectionTitle);
            font-size: 1.25rem;
            text-transform: uppercase;
        }

        .header-actions {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        /* Toggle Switches */
        .toggle-container {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            background: rgba(0, 0, 0, 0.2);
            padding: 0.4rem 1.2rem;
            border-radius: 50px;
            border: 1px solid var(--border-color);
        }

        .toggle-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 22px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255, 255, 255, 0.1);
            transition: .3s;
            border-radius: 34px;
            border: 1px solid var(--border-color);
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 2px;
            background-color: var(--text-main);
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--accent-transparent);
            border-color: var(--accent);
        }

        input:checked + .slider:before {
            transform: translateX(22px);
            background-color: var(--accent);
        }

        /* Standardized Action Buttons */
        .btn-outline, .btn-solid {
            font-family: 'Inter', sans-serif;
            padding: 0.6rem 1.5rem;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: var(--transition);
            text-transform: uppercase;
        }

        .btn-outline {
            border: 1px solid var(--border-color);
            color: var(--accent);
            background: transparent;
        }

        .btn-outline:hover {
            border-color: var(--accent);
            background: var(--accent-transparent);
        }

        .btn-solid {
            background-color: var(--accent);
            color: var(--bg-main);
            border: none;
            font-weight: 800;
        }

        .btn-solid:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(56, 217, 169, 0.2);
        }

        /* --- Main Layout Workspace --- */
        .workspace {
            display: flex;
            flex: 1;
            min-height: 0;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        /* --- JSON Dropzone overlay --- */
        #dropzone-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-main);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem;
        }

        .dropzone-box {
            max-width: 600px;
            width: 100%;
            border: 2px dashed rgba(255, 255, 255, 0.15);
            background: var(--bg-card);
            border-radius: 16px;
            padding: 5rem 3rem;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        .dropzone-box:hover, .dropzone-box.dragover {
            border-color: var(--accent);
            background: var(--accent-transparent);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transform: scale(1.02);
        }

        .dropzone-box svg {
            width: 60px;
            height: 60px;
            fill: var(--text-muted);
            transition: fill 0.3s ease;
        }

        .dropzone-box:hover svg, .dropzone-box.dragover svg {
            fill: var(--accent);
        }

        .dropzone-box p {
            color: var(--text-muted);
            font-size: 1.1rem;
            line-height: 1.5;
        }

        /* --- Sidebar (Left: Posts List) --- */
        .sidebar-left {
            width: 300px;
            background: var(--bg-card);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .search-sidebar {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.6rem 0.8rem;
            color: white;
            font-size: 0.85rem;
            outline: none;
            transition: var(--transition);
        }

        .search-sidebar:focus {
            border-color: var(--accent);
        }

        .posts-list {
            flex: 1;
            overflow-y: auto;
            padding: 0.8rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .post-item {
            padding: 0.8rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: var(--transition);
            position: relative;
        }

        .post-item:hover {
            background: rgba(255, 255, 255, 0.02);
            border-color: rgba(255, 255, 255, 0.04);
        }

        .post-item.active {
            background: var(--accent-transparent);
            border-color: rgba(56, 217, 169, 0.2);
        }

        .post-item-title {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 0.2rem;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 1.5rem;
        }

        .post-item.active .post-item-title {
            color: var(--accent);
        }

        .delete-post-btn {
            position: absolute;
            right: 0.8rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.2rem;
            opacity: 0;
            transition: opacity 0.2s ease, color 0.2s ease;
            padding: 0;
        }

        .post-item:hover .delete-post-btn {
            opacity: 1;
        }

        .delete-post-btn:hover {
            color: var(--danger);
        }

        /* --- Document Canvas (Center Pane) --- */
        .editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-main);
            overflow: hidden;
            position: relative;
            min-height: 0;
            height: 100%;
        }

        /* Formatting Toolbar (Google Docs Style) */
        .toolbar {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 0.5rem 1.5rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            align-items: center;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 0.2rem;
            border-right: 1px solid var(--border-color);
            padding-right: 0.6rem;
            margin-right: 0.2rem;
        }

        .toolbar-group:last-child {
            border: none;
            padding-right: 0;
            margin-right: 0;
        }

        .toolbar-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s ease;
            padding: 0;
        }

        .toolbar-btn svg {
            width: 18px;
            height: 18px;
        }

        .toolbar-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
        }

        .toolbar-btn.active {
            background: var(--accent-transparent);
            color: var(--accent);
            border-color: rgba(56, 217, 169, 0.2);
        }

        .toolbar-select {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 6px;
            padding: 0.2rem 0.6rem;
            font-size: 0.85rem;
            font-family: inherit;
            outline: none;
            height: 32px;
            cursor: pointer;
            transition: var(--transition);
        }

        .toolbar-select:focus, .toolbar-select:hover {
            border-color: var(--accent);
        }

        .toolbar-select option {
            background: var(--bg-card);
            color: white;
        }

        /* Editing Canvas Container */
        .editing-canvas-wrapper {
            flex: 1;
            overflow-y: auto;
            padding: 0 5%;
            min-height: 0;
            height: 100%;
        }

        /* Custom Scrollbar for Canvas */
        .editing-canvas-wrapper::-webkit-scrollbar { width: 8px; }
        .editing-canvas-wrapper::-webkit-scrollbar-track { background: var(--bg-main); }
        .editing-canvas-wrapper::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
        .editing-canvas-wrapper::-webkit-scrollbar-thumb:hover { background: var(--text-dark); }

        /* =========================================================================
           UNIFIED TYPOGRAPHY: Matches .document-page (Editor) and .preview-content (Preview) 
           ========================================================================= */
        .document-page, .preview-content {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            color: var(--text-muted);
            line-height: 1.8;
            font-size: 1.1rem;
            outline: none;
            overflow-wrap: break-word;
        }

        /* Specific to Editor to ensure smooth empty state */
        .document-page {
            min-height: 85vh;
            padding: 3rem 0 6rem 0; /* Breathing room top and bottom */
        }
        
        .document-page:focus {
            outline: none;
            border: none;
        }
        
        .document-page:empty:before {
            content: attr(placeholder);
            color: var(--text-dark);
            font-style: italic;
            cursor: text;
        }

        /* Specific to Preview */
        .preview-content {
            padding: 2rem 0 4rem 0;
        }

        /* Shared Element Styling */
        .document-page h2, .preview-content h2 {
            font-size: 2.2rem;
            color: var(--text-main);
            margin: 2.5rem 0 1.2rem;
            font-weight: 800;
        }

        .document-page h3, .preview-content h3 {
            font-size: 1.5rem;
            color: var(--sectionTitle);
            margin: 1.8rem 0 0.8rem;
            font-weight: 600;
        }

        .document-page p, .preview-content p {
            margin-bottom: 1.5rem;
        }

        .document-page a, .preview-content a {
            color: var(--accent);
            text-decoration: underline;
        }

        .document-page blockquote, .preview-content blockquote {
            border-left: 4px solid var(--accent);
            padding: 0.8rem 1.5rem;
            margin: 1.8rem 0;
            background: var(--accent-transparent);
            color: var(--text-muted);
            font-style: italic;
            border-radius: 0 8px 8px 0;
        }

        .document-page ul, .document-page ol, .preview-content ul, .preview-content ol {
            margin: 1.5rem 0;
            padding-left: 2rem;
        }

        .document-page li, .preview-content li {
            margin-bottom: 0.5rem;
        }

        .document-page pre, .preview-content pre {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 1.2rem;
            border-radius: 8px;
            overflow-x: auto;
            margin: 1.8rem 0;
            font-family: monospace;
            font-size: 0.95rem;
            color: var(--accent-hover);
        }

        .document-page code, .preview-content code {
            font-family: monospace;
            background: rgba(255, 255, 255, 0.08);
            color: #ef4444;
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
            font-size: 0.95rem;
        }

        .document-page pre code, .preview-content pre code {
            background: transparent;
            color: inherit;
            padding: 0;
        }

        .document-page img, .preview-content img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 2rem 0;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            display: block;
        }

        /* Selection styling */
        ::selection {
            background: var(--accent-transparent);
            color: var(--text-main);
        }

        /* --- Metadata Inspector (Right Sidebar) --- */
        .sidebar-right {
            width: 320px;
            background: var(--bg-card);
            border-left: 1px solid var(--border-color);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            flex-shrink: 0;
            overflow-y: auto;
        }

        .sidebar-right-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--sectionTitle);
            font-weight: 800;
            margin-bottom: 0.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .input-group label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .sidebar-right input, .sidebar-right textarea {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.8rem;
            color: white;
            font-family: inherit;
            font-size: 0.85rem;
            outline: none;
            transition: var(--transition);
        }

        .sidebar-right input:focus, .sidebar-right textarea:focus {
            border-color: var(--accent);
        }

        .sidebar-right textarea {
            height: 120px;
            resize: none;
        }

        .cover-preview {
            width: 100%;
            height: 140px;
            background-color: var(--bg-main);
            border-radius: 6px;
            background-size: cover;
            background-position: center;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-top: 0.5rem;
        }

        /* --- Live Preview Mode Pane --- */
        #preview-canvas-wrapper {
            display: none;
            flex: 1;
            background: var(--bg-main);
            overflow-y: auto;
            padding: 2rem 5%;
            min-height: 0;
            height: 100%;
        }

        /* Live Preview container */
        .preview-container {
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        /* Preview Header */
        .blog-header {
            text-align: center;
            padding: 2rem 0;
            border-bottom: 1px solid var(--border-color);
        }

        .blog-tags {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .blog-tag {
            color: var(--accent);
            background: var(--accent-transparent);
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 0.2rem 0.8rem;
            border-radius: 4px;
            border: 1px solid rgba(56, 217, 169, 0.05);
        }

        .blog-title {
            font-size: 3rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 1rem;
            color: var(--text-main);
        }

        .blog-desc {
            font-size: 1.2rem;
            color: var(--text-muted);
            max-width: 800px;
            margin: 0 auto 2rem auto;
        }

        .blog-hero-img {
            width: 100%;
            max-height: 500px;
            object-fit: cover;
            border-radius: 16px;
            background-color: #1a252f;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        /* --- Notification banner --- */
        #status-notification {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--success);
            color: #000;
            padding: 1rem 2rem;
            border-radius: 50px;
            font-weight: 800;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            box-shadow: 0 10px 30px rgba(56, 217, 169, 0.3);
            z-index: 1000;
            transform: translateY(150%);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #status-notification.show {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <header>
        <h1>GWO Setup Editor</h1>
        <div class="header-actions">
            <div class="toggle-container" id="view-toggle-container">
                <span class="toggle-label" id="edit-view-label" style="color: var(--accent);">Edit Mode</span>
                <label class="switch">
                    <input type="checkbox" id="view-toggle">
                    <span class="slider"></span>
                </label>
                <span class="toggle-label" id="preview-view-label">Live Preview</span>
            </div>
            
            <button class="btn-outline" onclick="clearWorkspace()">Clear</button>
            <button class="btn-solid" onclick="exportJSON()">Export GWO.json</button>
        </div>
    </header>

    <div class="workspace">
        <div id="dropzone-overlay" onclick="document.getElementById('file-input').click()">
            <div class="dropzone-box" id="dropzone">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M19.35 10.04A7.49 7.49 0 0 0 12 4C9.11 4 6.6 5.64 5.35 8.04A5.994 5.994 0 0 0 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM19 18H6c-2.21 0-4-1.79-4-4 0-2.05 1.53-3.76 3.56-3.97l1.07-.11.5-.95A5.469 5.469 0 0 1 12 6c2.62 0 4.88 1.86 5.39 4.43l.3 1.5 1.53.11c1.56.1 2.78 1.41 2.78 2.96 0 1.65-1.35 3-3 3zm-5.55-8h-2.9v3H8l4 4 4-4h-2.55z"/>
                </svg>
                <p>Drag & Drop your <strong>GWO.json</strong> file here,<br>or click to browse from directory</p>
                <input type="file" id="file-input" accept=".json" style="display: none;">
            </div>
        </div>

        <aside class="sidebar-left">
            <div class="sidebar-header">
                <button class="btn-solid" style="width: 100%; text-align: center;" onclick="createNewPost()">+ Create New Game</button>
                <input type="text" id="search-posts" class="search-sidebar" placeholder="Filter games...">
            </div>
            <div class="posts-list" id="posts-list-container">
                </div>
        </aside>

        <main class="editor-container" id="editor-pane">
            <div class="toolbar" id="doc-toolbar">
                <div class="toolbar-group">
                    <select class="toolbar-select" onchange="formatBlock(this.value)">
                        <option value="p">Normal Text</option>
                        <option value="h2">Heading 2</option>
                        <option value="h3">Heading 3</option>
                        <option value="blockquote">Quote</option>
                        <option value="pre">Code Block</option>
                    </select>
                </div>

                <div class="toolbar-group">
                    <button class="toolbar-btn" onclick="execCmd('bold')" title="Bold (Ctrl+B)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"></path><path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"></path></svg>
                    </button>
                    <button class="toolbar-btn" onclick="execCmd('italic')" title="Italic (Ctrl+I)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="4" x2="10" y2="4"></line><line x1="14" y1="20" x2="5" y2="20"></line><line x1="15" y1="4" x2="9" y2="20"></line></svg>
                    </button>
                    <button class="toolbar-btn" onclick="execCmd('underline')" title="Underline (Ctrl+U)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v7a6 6 0 0 0 6 6 6 6 0 0 0 6-6V3"></path><line x1="4" y1="21" x2="20" y2="21"></line></svg>
                    </button>
                    <button class="toolbar-btn" onclick="execCmd('strikeThrough')" title="Strikethrough">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><path d="M16 6C16 6 14.5 4 12 4C9.5 4 8 6 8 8C8 10 9.5 12 12 12C14.5 12 16 14 16 16C16 18 14.5 20 12 20C9.5 20 8 18 8 18"></path></svg>
                    </button>
                    <button class="toolbar-btn" onclick="execCmd('removeFormat')" title="Clear Formatting">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                </div>

                <div class="toolbar-group">
                    <button class="toolbar-btn" onclick="execCmd('justifyLeft')" title="Align Left">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="17" y1="10" x2="3" y2="10"></line><line x1="21" y1="6" x2="3" y2="6"></line><line x1="21" y1="14" x2="3" y2="14"></line><line x1="17" y1="18" x2="3" y2="18"></line></svg>
                    </button>
                    <button class="toolbar-btn" onclick="execCmd('justifyCenter')" title="Align Center">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="10" x2="6" y2="10"></line><line x1="21" y1="6" x2="3" y2="6"></line><line x1="21" y1="14" x2="3" y2="14"></line><line x1="18" y1="18" x2="6" y2="18"></line></svg>
                    </button>
                    <button class="toolbar-btn" onclick="execCmd('justifyRight')" title="Align Right">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="21" y1="10" x2="7" y2="10"></line><line x1="21" y1="6" x2="3" y2="6"></line><line x1="21" y1="14" x2="3" y2="14"></line><line x1="21" y1="18" x2="7" y2="18"></line></svg>
                    </button>
                    <button class="toolbar-btn" onclick="execCmd('justifyFull')" title="Justify">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="21" y1="10" x2="3" y2="10"></line><line x1="21" y1="6" x2="3" y2="6"></line><line x1="21" y1="14" x2="3" y2="14"></line><line x1="21" y1="18" x2="3" y2="18"></line></svg>
                    </button>
                </div>

                <div class="toolbar-group">
                    <button class="toolbar-btn" onclick="execCmd('insertUnorderedList')" title="Bulleted List">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
                    </button>
                    <button class="toolbar-btn" onclick="execCmd('insertOrderedList')" title="Numbered List">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="10" y1="6" x2="21" y2="6"></line><line x1="10" y1="12" x2="21" y2="12"></line><line x1="10" y1="18" x2="21" y2="18"></line><path d="M4 6h1v4"></path><path d="M4 10h2"></path><path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"></path></svg>
                    </button>
                </div>

                <div class="toolbar-group">
                    <button class="toolbar-btn" onclick="insertLink()" title="Insert Link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
                    </button>
                    <button class="toolbar-btn" onclick="insertImage()" title="Insert Image via URL">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                    </button>
                    <button class="toolbar-btn" onclick="document.getElementById('image-uploader').click()" title="Upload & Embed Inline Image">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                    </button>
                    <input type="file" id="image-uploader" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
                    <button class="toolbar-btn" onclick="execCmd('insertHorizontalRule')" title="Insert Horizontal Rule">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    </button>
                </div>

                <div class="toolbar-group">
                    <button class="toolbar-btn" onclick="execCmd('undo')" title="Undo (Ctrl+Z)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
                    </button>
                    <button class="toolbar-btn" onclick="execCmd('redo')" title="Redo (Ctrl+Y)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
                    </button>
                </div>
            </div>

            <div class="editing-canvas-wrapper">
                <div class="document-page" id="editing-canvas" contenteditable="true" placeholder="Start writing your blog article here..." oninput="syncEditorContent()" onblur="saveSelection()">
                    </div>
            </div>
        </main>

        <main id="preview-canvas-wrapper">
            <div class="preview-container blog-header">
                <div class="blog-tags" id="prev-tags">
                    </div>
                <h1 class="blog-title" id="prev-title">Title</h1>
                <p class="blog-desc" id="prev-desc">Description</p>
                <img class="blog-hero-img" id="prev-hero" src="" alt="Hero Image" style="display: none;">
            </div>
            
            <div class="preview-content ql-editor" id="prev-body">
                </div>
        </main>

        <aside class="sidebar-right" id="inspector-pane">
            <div class="sidebar-right-title">Game Metadata</div>
            
            <div class="input-group">
                <label>Title</label>
                <input type="text" id="post-title" placeholder="Enter game title" oninput="updateMetadata('title', this.value)">
            </div>

            <div class="input-group">
                <label>Cover Image Path/URL</label>
                <input type="text" id="post-cover" placeholder="images/game.jpg or https://..." oninput="updateMetadata('image', this.value)">
                <div class="cover-preview" id="post-cover-preview">No Cover Set</div>
            </div>

            <div class="input-group">
                <label>Description (Short)</label>
                <textarea id="post-excerpt" placeholder="Provide a brief description..." oninput="updateMetadata('description', this.value)"></textarea>
            </div>

            <div class="input-group">
                <label>Tags (Comma Separated)</label>
                <input type="text" id="post-tags" placeholder="Unity, Shader, VFX" oninput="updateTags(this.value)">
            </div>
        </aside>
    </div>

    <div id="status-notification">Workspace updated!</div>

    <script>
        // --- Global Editor State ---
        let blogs = [];
        let currentPostIdx = null;
        let isPreviewMode = false;
        let savedRange = null;

        const dropzoneOverlay = document.getElementById('dropzone-overlay');
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('file-input');
        
        const listContainer = document.getElementById('posts-list-container');
        const searchInput = document.getElementById('search-posts');

        const editorCanvas = document.getElementById('editing-canvas');
        const previewPane = document.getElementById('preview-canvas-wrapper');
        const editorPane = document.getElementById('editor-pane');
        const inspectorPane = document.getElementById('inspector-pane');

        // --- Drag and drop database import ---
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropzone.addEventListener(eventName, e => { e.preventDefault(); e.stopPropagation(); }, false);
        });
        ['dragenter', 'dragover'].forEach(eventName => dropzone.classList.add('dragover'));
        ['dragleave', 'drop'].forEach(eventName => dropzone.classList.remove('dragover'));

        dropzone.addEventListener('drop', e => handleFiles(e.dataTransfer.files));
        fileInput.addEventListener('change', e => handleFiles(e.target.files));

        function handleFiles(files) {
            if (files.length === 0) return;
            const file = files[0];
            if (!file.name.endsWith('.json')) {
                alert("Please drop a valid .json database file.");
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (Array.isArray(parsed)) {
                        blogs = parsed;
                        dropzoneOverlay.style.display = 'none';
                        renderPostsList();
                        if (blogs.length > 0) {
                            loadPost(0);
                        } else {
                            createNewPost();
                        }
                        showToast("Loaded database successfully!");
                    } else {
                        alert("The JSON database must contain an array of objects.");
                    }
                } catch (err) {
                    alert("Failed to parse JSON file. Ensure formatting is correct.");
                }
            };
            reader.readAsText(file);
        }

        // --- Left Sidebar: Listing & Search ---
        function renderPostsList() {
            listContainer.innerHTML = '';
            const searchVal = searchInput.value.toLowerCase().trim();

            blogs.forEach((post, index) => {
                const titleStr = post.title || 'Untitled Game';
                const descStr = post.description || '';
                const tagsStr = (post.tags || []).join(' ');
                
                const matchesSearch = titleStr.toLowerCase().includes(searchVal) || 
                                      descStr.toLowerCase().includes(searchVal) ||
                                      tagsStr.toLowerCase().includes(searchVal);
                
                if (!matchesSearch) return;

                const item = document.createElement('div');
                item.className = `post-item ${currentPostIdx === index ? 'active' : ''}`;
                item.onclick = () => loadPost(index);

                item.innerHTML = `
                    <div class="post-item-title">${titleStr}</div>
                    <button class="delete-post-btn" title="Delete Game" onclick="deletePost(event, ${index})">&times;</button>
                `;
                listContainer.appendChild(item);
            });
        }

        searchInput.addEventListener('input', renderPostsList);

        // --- Load Selected Post into Canvas & Inspector ---
        function loadPost(index) {
            if (index < 0 || index >= blogs.length) return;
            
            // Save current editor content before loading new post
            saveCurrentEditorData();

            currentPostIdx = index;
            const post = blogs[index];

            // Render contenteditable
            editorCanvas.innerHTML = post.blogContent || '';

            // Load Inspector fields
            document.getElementById('post-title').value = post.title || '';
            document.getElementById('post-cover').value = post.image || '';
            document.getElementById('post-excerpt').value = post.description || '';
            document.getElementById('post-tags').value = (post.tags || []).join(', ');

            updateCoverPreview(post.image);
            
            // Highlight active sidebar item
            document.querySelectorAll('.post-item').forEach((item, idx) => {
                if (idx === index) item.classList.add('active');
                else item.classList.remove('active');
            });

            // If in preview mode, refresh preview
            if (isPreviewMode) {
                renderLivePreview();
            }
        }

        function saveCurrentEditorData() {
            if (currentPostIdx !== null && blogs[currentPostIdx]) {
                blogs[currentPostIdx].blogContent = editorCanvas.innerHTML;
            }
        }

        function updateCoverPreview(coverUrl) {
            const preview = document.getElementById('post-cover-preview');
            if (coverUrl) {
                preview.style.backgroundImage = `url('${coverUrl}')`;
                preview.textContent = '';
            } else {
                preview.style.backgroundImage = 'none';
                preview.textContent = 'No Cover Set';
            }
        }

        // --- Workspace operations ---
        function createNewPost() {
            saveCurrentEditorData();
            
            const newArticle = {
                title: "Untitled Game",
                description: "Provide a brief description...",
                image: "",
                tags: ["GAME"],
                blogContent: "<h2>Introduction</h2><p>Start writing here...</p>"
            };

            blogs.unshift(newArticle); // Put it at the top
            renderPostsList();
            loadPost(0);
        }

        function deletePost(e, index) {
            e.stopPropagation(); // Stop trigger loadPost
            if (confirm(`Are you sure you want to delete "${blogs[index].title}"?`)) {
                blogs.splice(index, 1);
                
                if (blogs.length === 0) {
                    currentPostIdx = null;
                    createNewPost();
                } else {
                    let nextIdx = 0;
                    if (currentPostIdx === index) {
                        nextIdx = Math.max(0, index - 1);
                    } else if (currentPostIdx > index) {
                        nextIdx = currentPostIdx - 1;
                    } else {
                        nextIdx = currentPostIdx;
                    }
                    renderPostsList();
                    loadPost(nextIdx);
                }
                showToast("Game deleted!");
            }
        }

        function clearWorkspace() {
            if (confirm("Reset editor workspace? Unsaved changes will be discarded.")) {
                blogs = [];
                currentPostIdx = null;
                editorCanvas.innerHTML = '';
                listContainer.innerHTML = '';
                fileInput.value = '';
                dropzoneOverlay.style.display = 'flex';
                showToast("Workspace cleared!");
            }
        }

        // --- Real-time metadata syncing ---
        function updateMetadata(field, value) {
            if (currentPostIdx === null || !blogs[currentPostIdx]) return;
            
            blogs[currentPostIdx][field] = value;

            if (field === 'title') {
                // Refresh title in sidebar item
                const activeItem = listContainer.querySelector('.post-item.active .post-item-title');
                if (activeItem) activeItem.textContent = value || 'Untitled Game';
            }

            if (field === 'image') {
                updateCoverPreview(value);
            }

            // Sync with preview if active
            if (isPreviewMode) renderLivePreview();
        }

        function updateTags(value) {
            if (currentPostIdx === null || !blogs[currentPostIdx]) return;
            blogs[currentPostIdx].tags = value.split(',').map(t => t.trim()).filter(Boolean);
            if (isPreviewMode) renderLivePreview();
        }

        // Syncs contenteditable inputs instantly back to object
        function syncEditorContent() {
            if (currentPostIdx === null || !blogs[currentPostIdx]) return;
            blogs[currentPostIdx].blogContent = editorCanvas.innerHTML;
        }

        // --- WYSIWYG selection helper logic ---
        function saveSelection() {
            if (window.getSelection) {
                let sel = window.getSelection();
                if (sel.rangeCount > 0) {
                    savedRange = sel.getRangeAt(0);
                }
            }
        }

        function restoreSelection() {
            if (savedRange) {
                if (window.getSelection) {
                    let sel = window.getSelection();
                    sel.removeAllRanges();
                    sel.addRange(savedRange);
                }
            }
        }

        // --- Rich Text Commands Engine ---
        function execCmd(command, arg = null) {
            restoreSelection();
            document.execCommand(command, false, arg);
            editorCanvas.focus();
            syncEditorContent();
        }

        function formatBlock(tag) {
            execCmd('formatBlock', `<${tag}>`);
        }

        function insertLink() {
            const url = prompt("Enter hyperlink URL:");
            if (url) {
                execCmd('createLink', url);
            }
        }

        function insertImage() {
            const path = prompt("Enter relative image path (e.g. images/blog/ref.jpg) or absolute URL:");
            if (path) {
                execCmd('insertImage', path);
            }
        }

        // --- Handle File Upload and Inline Base64 Conversion ---
        function handleImageUpload(e) {
            const files = e.target.files;
            if (files.length === 0) return;
            const file = files[0];

            if (!file.type.startsWith('image/')) {
                alert('File is not an image!');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(event) {
                const base64Data = event.target.result;
                execCmd('insertImage', base64Data);
                // Clear input value to allow uploading same file again
                e.target.value = '';
            };
            reader.readAsDataURL(file);
        }

        // Keyboard Shortcuts in Contenteditable
        editorCanvas.addEventListener('keydown', (e) => {
            // Check for hotkeys: Ctrl+B, Ctrl+I, Ctrl+U
            if (e.ctrlKey) {
                if (e.key === 'b') { e.preventDefault(); execCmd('bold'); }
                if (e.key === 'i') { e.preventDefault(); execCmd('italic'); }
                if (e.key === 'u') { e.preventDefault(); execCmd('underline'); }
            }
        });

        // --- View Mode Toggle ---
        const viewToggle = document.getElementById('view-toggle');
        const editViewLabel = document.getElementById('edit-view-label');
        const previewViewLabel = document.getElementById('preview-view-label');

        viewToggle.addEventListener('change', () => {
            isPreviewMode = viewToggle.checked;
            if (isPreviewMode) {
                previewViewLabel.style.color = 'var(--accent)';
                previewViewLabel.style.fontWeight = 'bold';
                editViewLabel.style.color = 'var(--text-muted)';
                editViewLabel.style.fontWeight = 'normal';
                
                // Switch display views
                editorPane.style.display = 'none';
                previewPane.style.display = 'block';
                
                saveCurrentEditorData();
                renderLivePreview();
            } else {
                editViewLabel.style.color = 'var(--accent)';
                editViewLabel.style.fontWeight = 'bold';
                previewViewLabel.style.color = 'var(--text-muted)';
                previewViewLabel.style.fontWeight = 'normal';
                
                // Switch display views
                previewPane.style.display = 'none';
                editorPane.style.display = 'flex';
                
                // Reload post back into contenteditable
                if (currentPostIdx !== null) {
                    loadPost(currentPostIdx);
                }
            }
        });

        // --- Render Live Preview ---
        function renderLivePreview() {
            if (currentPostIdx === null || !blogs[currentPostIdx]) return;
            const post = blogs[currentPostIdx];

            const title = document.getElementById('prev-title');
            const desc = document.getElementById('prev-desc');
            const hero = document.getElementById('prev-hero');
            const tagsContainer = document.getElementById('prev-tags');
            const body = document.getElementById('prev-body');

            title.textContent = post.title || 'Untitled Game';
            desc.textContent = post.description || '';
            
            if (post.image) {
                hero.src = post.image;
                hero.style.display = 'block';
            } else {
                hero.style.display = 'none';
            }

            tagsContainer.innerHTML = (post.tags && post.tags.length > 0 ? post.tags : []).map(tag => `<span class="blog-tag">${tag}</span>`).join('');
            
            body.innerHTML = post.blogContent || '';
        }

        // --- Export JSON Database ---
        function exportJSON() {
            saveCurrentEditorData();

            if (blogs.length === 0) {
                alert("Nothing to export. Create a game first!");
                return;
            }

            // Cleanup posts array
            const cleanBlogs = blogs.map(b => {
                return {
                    title: b.title || "Untitled",
                    image: b.image || "",
                    tags: b.tags || [],
                    description: b.description || "",
                    blogContent: b.blogContent || ""
                };
            });

            const dataStr = JSON.stringify(cleanBlogs, null, 2);
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = "GWO.json";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            showToast("JSON database exported successfully!");
        }

        // --- UI Utilities ---
        function showToast(msg) {
            const toast = document.getElementById('status-notification');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
