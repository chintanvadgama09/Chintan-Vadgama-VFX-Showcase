<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CloudReader · Cross‑Device PDF Memory (No Login)</title>
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, system-ui;
            background: #1a1e2c;
            color: #eef4ff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .app-header {
            background: #0f1222;
            padding: 0.8rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 1px solid #2d3348;
        }
        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-area i { font-size: 1.8rem; color: #6c8eff; }
        .logo-area h1 { font-size: 1.4rem; }
        .sync-area { display: flex; gap: 10px; align-items: center; background: #1a1f32; padding: 5px 12px; border-radius: 40px; }
        .sync-area input { background: #0b0e1a; border: 1px solid #2d3348; padding: 6px 12px; border-radius: 30px; color: white; width: 200px; font-size: 0.8rem; }
        .sync-status { font-size: 0.75rem; background: #252a41; padding: 4px 10px; border-radius: 20px; }
        button {
            background: #2d3250;
            border: none;
            color: white;
            padding: 6px 14px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        button.primary { background: #5f7bff; }
        button.primary:hover { background: #4a65e0; }
        button:hover { background: #3f4570; }
        .main-container { display: flex; flex: 1; overflow: hidden; }
        .library-panel {
            width: 300px;
            background: #11141f;
            border-right: 1px solid #232838;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        .library-header { padding: 18px 16px 10px; font-weight: 600; border-bottom: 1px solid #252c3f; display: flex; justify-content: space-between; }
        .add-book-form { padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid #252c3f; }
        .add-book-form input { background: #1e243b; border: 1px solid #333c5a; padding: 10px 12px; border-radius: 28px; color: white; outline: none; }
        .book-list { flex: 1; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
        .book-card {
            background: #1a1f32;
            border-radius: 20px;
            padding: 12px 14px;
            cursor: pointer;
            border-left: 4px solid transparent;
        }
        .book-card.active { border-left-color: #5f7bff; background: #262e4a; }
        .book-title { font-weight: 600; margin-bottom: 6px; word-break: break-word; }
        .book-progress { font-size: 0.7rem; color: #9aa4bf; display: flex; justify-content: space-between; margin-top: 6px; }
        .book-actions { display: flex; gap: 8px; margin-top: 8px; justify-content: flex-end; }
        .book-actions button { padding: 4px 10px; font-size: 0.7rem; background: #2f3657; }
        .viewer-panel { flex: 1; display: flex; flex-direction: column; background: #0e111b; overflow: hidden; }
        .viewer-toolbar { padding: 12px 20px; background: #14182b; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; border-bottom: 1px solid #252b42; }
        .page-info { background: #00000030; padding: 6px 12px; border-radius: 32px; }
        .zoom-group, .rotate-group { display: flex; gap: 6px; }
        .canvas-container { flex: 1; overflow: auto; display: flex; justify-content: center; align-items: center; background: #1a1e2c; padding: 20px; position: relative; }
        canvas { box-shadow: 0 12px 28px rgba(0,0,0,0.4); border-radius: 8px; background: white; transition: 0.1s; }
        .empty-viewer { text-align: center; color: #6f7a9e; }
        .loading-spinner { position: absolute; background: #000000aa; padding: 8px 20px; border-radius: 40px; font-size: 0.8rem; }
        @media (max-width: 700px) { .library-panel { width: 260px; } }
    </style>
</head>
<body>

<div class="app-header">
    <div class="logo-area"><i class="fas fa-book-open"></i><h1>CloudReader</h1><span style="font-size:0.7rem;">↻ cross‑device memory</span></div>
    <div class="sync-area">
        <i class="fas fa-cloud-upload-alt"></i>
        <input type="text" id="syncKeyInput" placeholder="Sync key (share across devices)" value="myreading2025">
        <button id="loadSyncKeyBtn" class="primary"><i class="fas fa-sync"></i> Load / Sync</button>
        <span id="syncStatus" class="sync-status"><i class="fas fa-database"></i> ready</span>
    </div>
</div>

<div class="main-container">
    <div class="library-panel">
        <div class="library-header"><span><i class="fas fa-layer-group"></i> My Library</span><span id="bookCountBadge">0</span></div>
        <div class="add-book-form">
            <input type="text" id="bookTitleInput" placeholder="Book name">
            <input type="text" id="driveLinkInput" placeholder="Google Drive public link (PDF)">
            <button id="addBookBtn" class="primary"><i class="fas fa-plus-circle"></i> Add to library</button>
        </div>
        <div class="book-list" id="bookListContainer"><div style="padding:20px; text-align:center;">📚 Add a PDF to start</div></div>
    </div>
    <div class="viewer-panel">
        <div class="viewer-toolbar">
            <button id="backToLibraryBtn"><i class="fas fa-arrow-left"></i> Library</button>
            <div style="width:1px; background:#2f3550; height:28px;"></div>
            <button id="prevPageBtn" disabled><i class="fas fa-chevron-left"></i> Prev</button>
            <span class="page-info" id="pageNumInfo">— / —</span>
            <button id="nextPageBtn" disabled>Next <i class="fas fa-chevron-right"></i></button>
            <div class="zoom-group">
                <button id="zoomOutBtn" disabled><i class="fas fa-search-minus"></i></button>
                <span id="zoomLevel" style="min-width:45px;">100%</span>
                <button id="zoomInBtn" disabled><i class="fas fa-search-plus"></i></button>
            </div>
            <div class="rotate-group">
                <button id="rotateLeftBtn" disabled><i class="fas fa-undo-alt"></i> Rotate</button>
                <button id="rotateRightBtn" disabled><i class="fas fa-redo-alt"></i> Rotate</button>
            </div>
        </div>
        <div class="canvas-container" id="canvasContainer">
            <div class="empty-viewer" id="emptyViewerMsg"><i class="fas fa-book" style="font-size:3rem;"></i><br/>Select a book from library</div>
            <canvas id="pdfCanvas" style="display:none;"></canvas>
        </div>
    </div>
</div>

<script>
    // ---------- CLOUD SYNC using JSONBin.io (free, no auth) ----------
    // Each sync key creates a unique bin. All devices with same key share library & progress.
    const JSONBIN_URL = "https://api.jsonbin.io/v3/b";
    let currentBinId = null;
    let currentAccessKey = null;
    let libraryData = { books: [] };      // each book: { id, title, pdfUrl, currentPage, totalPages }
    let currentUserKey = "myreading2025";
    
    // UI elements
    const syncKeyInput = document.getElementById('syncKeyInput');
    const loadSyncKeyBtn = document.getElementById('loadSyncKeyBtn');
    const syncStatusSpan = document.getElementById('syncStatus');
    const bookListContainer = document.getElementById('bookListContainer');
    const addBookBtn = document.getElementById('addBookBtn');
    const driveLinkInput = document.getElementById('driveLinkInput');
    const bookTitleInput = document.getElementById('bookTitleInput');
    const prevPageBtn = document.getElementById('prevPageBtn');
    const nextPageBtn = document.getElementById('nextPageBtn');
    const pageNumInfo = document.getElementById('pageNumInfo');
    const zoomInBtn = document.getElementById('zoomInBtn');
    const zoomOutBtn = document.getElementById('zoomOutBtn');
    const zoomLevelSpan = document.getElementById('zoomLevel');
    const rotateLeftBtn = document.getElementById('rotateLeftBtn');
    const rotateRightBtn = document.getElementById('rotateRightBtn');
    const emptyViewerMsg = document.getElementById('emptyViewerMsg');
    const pdfCanvas = document.getElementById('pdfCanvas');
    const ctx = pdfCanvas.getContext('2d');
    const backToLibraryBtn = document.getElementById('backToLibraryBtn');
    
    // PDF state
    let currentBookId = null;
    let pdfDoc = null;
    let currentPage = 1;
    let totalPages = 0;
    let currentScale = 1.3;
    let currentRotation = 0;
    let rendering = false;
    
    // Helper: extract direct Google Drive PDF link
    function extractDirectDownloadUrl(driveUrl) {
        let fileId = null;
        const match1 = driveUrl.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
        if (match1) fileId = match1[1];
        else {
            const match2 = driveUrl.match(/id=([a-zA-Z0-9_-]+)/);
            if (match2) fileId = match2[1];
            else if (driveUrl.includes('uc?id=')) {
                const urlParams = new URLSearchParams(driveUrl.split('?')[1]);
                fileId = urlParams.get('id');
            }
        }
        if (!fileId) return null;
        return `https://drive.google.com/uc?export=download&id=${fileId}`;
    }
    
    // Load from JSONBin
    async function loadLibraryFromCloud(key) {
        syncStatusSpan.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> syncing...';
        try {
            // Try to find existing bin by key (stored in localStorage mapping)
            let binId = localStorage.getItem(`jsonbin_id_${key}`);
            if (binId) {
                const response = await fetch(`${JSONBIN_URL}/${binId}/latest`, { headers: { 'X-Bin-Meta': 'false' } });
                if (response.ok) {
                    const data = await response.json();
                    libraryData = data;
                    currentBinId = binId;
                    currentAccessKey = key;
                    syncStatusSpan.innerHTML = '<i class="fas fa-check-circle"></i> cloud sync on';
                    renderBookList();
                    return;
                }
            }
            // No existing bin, create new one
            const defaultData = { books: [] };
            const createResp = await fetch(JSONBIN_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(defaultData)
            });
            const createJson = await createResp.json();
            if (createJson.metadata?.id) {
                currentBinId = createJson.metadata.id;
                currentAccessKey = key;
                libraryData = defaultData;
                localStorage.setItem(`jsonbin_id_${key}`, currentBinId);
                syncStatusSpan.innerHTML = '<i class="fas fa-cloud-upload-alt"></i> new cloud library';
                renderBookList();
            } else throw new Error("Bin creation failed");
        } catch (err) {
            console.error(err);
            syncStatusSpan.innerHTML = '<i class="fas fa-exclamation-triangle"></i> offline mode (local only)';
            // Fallback: keep existing libraryData or load from localStorage
            const local = localStorage.getItem(`local_library_${key}`);
            if (local) libraryData = JSON.parse(local);
            else libraryData = { books: [] };
            renderBookList();
        }
    }
    
    async function saveLibraryToCloud() {
        if (!currentBinId) return;
        try {
            await fetch(`${JSONBIN_URL}/${currentBinId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(libraryData)
            });
            syncStatusSpan.innerHTML = '<i class="fas fa-check-circle"></i> saved';
            setTimeout(() => { if (currentBinId) syncStatusSpan.innerHTML = '<i class="fas fa-cloud"></i> synced'; }, 1500);
        } catch(e) { console.warn("auto-save failed"); }
        // also cache locally
        if (currentAccessKey) localStorage.setItem(`local_library_${currentAccessKey}`, JSON.stringify(libraryData));
    }
    
    // UI: render library from libraryData.books
    function renderBookList() {
        const books = libraryData.books || [];
        document.getElementById('bookCountBadge').innerText = books.length;
        if (!books.length) {
            bookListContainer.innerHTML = '<div style="padding:20px; text-align:center;"><i class="fas fa-plus-circle"></i> Add your first PDF via Google Drive link</div>';
            return;
        }
        bookListContainer.innerHTML = '';
        books.forEach(book => {
            const card = document.createElement('div');
            card.className = 'book-card';
            if (currentBookId === book.id) card.classList.add('active');
            card.innerHTML = `
                <div class="book-title"><i class="fas fa-file-pdf"></i> ${escapeHtml(book.title)}</div>
                <div class="book-progress">📖 last page: ${book.currentPage || 1} / ${book.totalPages || '?'}</div>
                <div class="book-actions">
                    <button class="read-book-btn" data-id="${book.id}" data-url="${book.pdfUrl}" data-title="${escapeHtml(book.title)}"><i class="fas fa-book-open"></i> Read</button>
                    <button class="delete-book-btn" data-id="${book.id}"><i class="fas fa-trash-alt"></i> Delete</button>
                </div>
            `;
            bookListContainer.appendChild(card);
        });
        document.querySelectorAll('.read-book-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const id = btn.getAttribute('data-id');
                const url = btn.getAttribute('data-url');
                const title = btn.getAttribute('data-title');
                openBook(id, url, title);
            });
        });
        document.querySelectorAll('.delete-book-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                e.stopPropagation();
                const id = btn.getAttribute('data-id');
                if (confirm('Remove this book from library? Progress lost.')) {
                    libraryData.books = libraryData.books.filter(b => b.id !== id);
                    await saveLibraryToCloud();
                    if (currentBookId === id) clearViewer();
                    renderBookList();
                }
            });
        });
    }
    
    function escapeHtml(str) { return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }
    
    addBookBtn.onclick = async () => {
        let driveUrl = driveLinkInput.value.trim();
        let title = bookTitleInput.value.trim();
        if (!driveUrl) { alert("Enter Google Drive public PDF link"); return; }
        const pdfDirect = extractDirectDownloadUrl(driveUrl);
        if (!pdfDirect) { alert("Invalid Drive link. Use shareable link like: https://drive.google.com/file/d/.../view"); return; }
        if (!title) title = "PDF " + new Date().toLocaleDateString();
        // test PDF accessibility
        try {
            const testTask = pdfjsLib.getDocument(pdfDirect);
            await testTask.promise;
        } catch(e) { alert("Cannot load PDF. Make sure link is public and points to a PDF."); return; }
        const bookId = btoa(pdfDirect).slice(0, 40).replace(/[^a-zA-Z0-9]/g, '_');
        if (libraryData.books.some(b => b.id === bookId)) { alert("Book already in library"); return; }
        libraryData.books.push({
            id: bookId,
            title: title,
            pdfUrl: pdfDirect,
            currentPage: 1,
            totalPages: null
        });
        await saveLibraryToCloud();
        renderBookList();
        driveLinkInput.value = '';
        bookTitleInput.value = '';
    };
    
    async function openBook(bookId, pdfUrl, title) {
        currentBookId = bookId;
        emptyViewerMsg.style.display = 'none';
        pdfCanvas.style.display = 'block';
        const container = document.getElementById('canvasContainer');
        let loadingDiv = document.createElement('div');
        loadingDiv.className = 'loading-spinner';
        loadingDiv.innerText = 'Loading PDF ...';
        container.appendChild(loadingDiv);
        try {
            const loadingTask = pdfjsLib.getDocument(pdfUrl);
            pdfDoc = await loadingTask.promise;
            totalPages = pdfDoc.numPages;
            const book = libraryData.books.find(b => b.id === bookId);
            let savedPage = (book && book.currentPage) ? book.currentPage : 1;
            if (savedPage > totalPages) savedPage = 1;
            currentPage = savedPage;
            currentRotation = 0;
            currentScale = 1.3;
            // update total pages in library
            if (book) { book.totalPages = totalPages; await saveLibraryToCloud(); }
            await renderPage();
            enableControls(true);
            updatePageInfo();
            renderBookList(); // refresh active highlight
        } catch(err) {
            alert("Failed to load PDF. Check CORS / public access.");
            clearViewer();
        } finally { loadingDiv.remove(); }
    }
    
    async function renderPage() {
        if (!pdfDoc || rendering) return;
        rendering = true;
        try {
            const page = await pdfDoc.getPage(currentPage);
            const viewport = page.getViewport({ scale: currentScale, rotation: currentRotation });
            pdfCanvas.width = viewport.width;
            pdfCanvas.height = viewport.height;
            await page.render({ canvasContext: ctx, viewport: viewport }).promise;
            zoomLevelSpan.innerText = `${Math.round(currentScale * 100)}%`;
        } catch(e) {} finally { rendering = false; }
    }
    
    function updatePageInfo() {
        pageNumInfo.innerText = `${currentPage} / ${totalPages}`;
        prevPageBtn.disabled = currentPage <= 1;
        nextPageBtn.disabled = currentPage >= totalPages;
        // save progress to cloud & library
        if (currentBookId && libraryData.books) {
            const book = libraryData.books.find(b => b.id === currentBookId);
            if (book && book.currentPage !== currentPage) {
                book.currentPage = currentPage;
                saveLibraryToCloud();
            }
        }
    }
    
    function enableControls(enabled) {
        [prevPageBtn, nextPageBtn, zoomInBtn, zoomOutBtn, rotateLeftBtn, rotateRightBtn].forEach(btn => btn.disabled = !enabled);
    }
    
    function clearViewer() {
        pdfDoc = null;
        currentBookId = null;
        pdfCanvas.style.display = 'none';
        emptyViewerMsg.style.display = 'flex';
        enableControls(false);
        pageNumInfo.innerText = '— / —';
    }
    
    // Navigation & zoom
    prevPageBtn.onclick = async () => { if(pdfDoc && currentPage > 1) { currentPage--; await renderPage(); updatePageInfo(); } };
    nextPageBtn.onclick = async () => { if(pdfDoc && currentPage < totalPages) { currentPage++; await renderPage(); updatePageInfo(); } };
    zoomInBtn.onclick = async () => { if(pdfDoc) { currentScale = Math.min(3.0, currentScale + 0.15); await renderPage(); } };
    zoomOutBtn.onclick = async () => { if(pdfDoc) { currentScale = Math.max(0.6, currentScale - 0.15); await renderPage(); } };
    rotateLeftBtn.onclick = async () => { if(pdfDoc) { currentRotation = (currentRotation - 90 + 360) % 360; await renderPage(); } };
    rotateRightBtn.onclick = async () => { if(pdfDoc) { currentRotation = (currentRotation + 90) % 360; await renderPage(); } };
    backToLibraryBtn.onclick = () => { clearViewer(); renderBookList(); };
    
    loadSyncKeyBtn.onclick = () => {
        const newKey = syncKeyInput.value.trim();
        if (!newKey) return;
        currentUserKey = newKey;
        loadLibraryFromCloud(currentUserKey);
    };
    
    // initial load
    loadLibraryFromCloud("myreading2025");
</script>
</body>
</html>
