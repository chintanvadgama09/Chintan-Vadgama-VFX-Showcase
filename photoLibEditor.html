<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic Pipeline | Chintan Vadgama</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');

        /* --- Color Palette & Variables --- */
        :root {
            --bg-main: #060b0f;
            --bg-secondary: #0b171e;
            --bg-panel: rgba(10, 15, 20, 0.8);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --accent-teal: rgb(95, 150, 189);
            --accent-hover: #00d2d6;
            --danger: #ef4444;
            --swap-color: #10b981; 
            --tile-color: #7eaed1;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            /* Synced to 10% to perfectly match the live site container width */
            padding: 2rem 10%; 
            overflow-x: hidden;
        }

        /* --- Header & Controls --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
        }

        h1 {
            font-weight: 400;
            letter-spacing: 2px;
            color: var(--tile-color);
            font-size: 1.5rem;
            text-transform: uppercase;
        }

        .control-group {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        /* --- Toggle Switch UI --- */
        .toggle-container { 
            display: flex; align-items: center; gap: 0.6rem; 
            background: var(--bg-secondary); padding: 0.4rem 1.2rem; 
            border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);
        }
        .toggle-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); transition: color 0.3s ease; }
        .switch { position: relative; display: inline-block; width: 44px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(255,255,255,0.1); transition: .4s; border-radius: 34px; border: 1px solid rgba(255,255,255,0.2); }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: var(--text-main); transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: rgba(16, 185, 129, 0.2); border-color: var(--swap-color); }
        input:checked + .slider:before { transform: translateX(22px); background-color: var(--swap-color); }

        button {
            background: var(--bg-secondary);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.6rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            border-color: var(--accent-teal);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(95, 150, 189, 0.2);
        }

        button.primary {
            background: var(--accent-teal);
            color: var(--bg-main);
            font-weight: 600;
            border: none;
        }

        button.primary:hover {
            background: var(--accent-hover);
            box-shadow: 0 5px 25px rgba(0, 210, 214, 0.4);
        }

        /* --- Drag & Drop JSON Import Zone --- */
        #json-dropzone {
            width: 100%;
            padding: 3rem 2rem;
            border: 2px dashed rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            text-align: center;
            margin-bottom: 2rem;
            background: var(--bg-secondary);
            transition: all 0.4s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }

        #json-dropzone:hover, #json-dropzone.dragover {
            border-color: var(--accent-teal);
            background: rgba(95, 150, 189, 0.05);
            transform: scale(1.01);
        }

        #json-dropzone p { color: var(--text-muted); font-size: 1.1rem; pointer-events: none; }
        #json-dropzone svg { width: 40px; height: 40px; fill: var(--text-muted); pointer-events: none; transition: fill 0.3s ease; }
        #json-dropzone.dragover svg { fill: var(--accent-teal); }
        input[type="file"] { display: none; }

        /* --- Add New Photo Form --- */
        .add-form {
            background: var(--bg-panel);
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 2rem;
            display: flex;
            gap: 1.5rem;
            align-items: flex-end;
            backdrop-filter: blur(10px);
            display: none; 
        }
        
        .add-form.active { display: flex; }
        .input-group { display: flex; flex-direction: column; gap: 0.5rem; flex: 1; min-width: 0; }
        .input-group label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        
        .input-group input {
            background: rgba(0, 0, 0, 0.3); border: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            color: white; padding: 0.8rem 0.5rem;
            font-family: 'Inter', sans-serif; transition: border-color 0.3s ease;
        }
        .input-group input:focus { outline: none; border-color: var(--accent-teal); }

        /* --- Justified Layout Editor Grid --- */
        #gallery-container {
            display: flex;
            flex-direction: column;
            gap: 12px; 
            width: 100%;
            padding-bottom: 100px;
        }
        
        .gallery-row {
            display: flex;
            flex-direction: row;
            gap: 12px; 
            width: 100%;
        }

        .photo-card {
            background: var(--bg-secondary);
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
            cursor: grab;
            position: relative;
            display: flex;
            flex-direction: column;
            
            /* CRITICAL FIX: Forces Flexbox to ignore long URLs and strictly obey the aspect-ratio math */
            min-width: 0; 
            
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                        box-shadow 0.4s ease, border-color 0.3s ease, opacity 0.4s ease;
        }

        /* Initial Load Animations Only */
        .photo-card.stagger-prep { opacity: 0; transform: translateY(30px) scale(0.95); }
        .photo-card.animate-in { opacity: 1; transform: translateY(0) scale(1); }

        .photo-card:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 15px rgba(95, 150, 189, 0.1);
            border-color: rgba(95, 150, 189, 0.3);
            z-index: 2;
        }

        .photo-card:active { cursor: grabbing; }

        /* Drag & Drop Visuals */
        .photo-card.dragging {
            opacity: 0.4 !important;
            transform: scale(0.9) !important;
            box-shadow: none !important;
        }

        /* Default Insert Mode */
        .photo-card.drag-over {
            border: 2px dashed var(--accent-hover);
            transform: scale(1.05);
            opacity: 0.8;
        }

        /* Swap Mode */
        .photo-card.swap-mode {
            border: 2px dashed var(--swap-color);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.2);
            transform: scale(1.05);
            opacity: 0.8;
        }

        .card-img-wrapper {
            width: 100%;
            flex-grow: 1; 
            background: #000;
            position: relative;
            min-width: 0;
        }

        .card-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            display: block;
            pointer-events: none;
        }

        .card-info { 
            height: 85px; 
            padding: 0.8rem 1rem; 
            background: rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0; /* CRITICAL FIX */
        }
        
        .card-info input {
            width: 100%;
            min-width: 0; /* CRITICAL FIX: Allows input to shrink smaller than the long URL string */
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 0.3rem 0;
            font-family: 'Inter', sans-serif;
            margin-bottom: 0.4rem;
            transition: border-color 0.3s ease;
        }

        .card-info input:focus { outline: none; border-color: var(--accent-hover); }
        .card-info input.title-input { font-weight: 600; font-size: 0.9rem; }
        .card-info input.src-input { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0;}

        .delete-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: var(--text-muted);
            border: 1px solid rgba(255,255,255,0.2);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            z-index: 10;
            backdrop-filter: blur(5px);
        }

        .delete-btn:hover {
            background: var(--danger);
            color: white;
            border-color: var(--danger);
            transform: scale(1.1) rotate(90deg);
        }

    </style>
</head>
<body>

    <header>
        <h1>JSON Setup Pipeline</h1>
        <div class="control-group">
            <div class="toggle-container">
                <span class="toggle-label" id="insert-label" style="color: var(--accent-hover); font-weight: bold;">Insert</span>
                <label class="switch">
                    <input type="checkbox" id="mode-toggle">
                    <span class="slider round"></span>
                </label>
                <span class="toggle-label" id="swap-label">Swap</span>
            </div>
            <span style="color: var(--text-muted); font-size: 0.8rem; margin-right: 1rem;">
                (Hold <strong>'S'</strong> key to auto-switch)
            </span>
            <button onclick="clearWorkspace()">Clear</button>
            <button class="primary" onclick="exportJSON()">Export json</button>
        </div>
    </header>

    <div id="json-dropzone" onclick="document.getElementById('file-input').click()">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
        </svg>
        <p>Drag & Drop your <strong>photos.json</strong> here, or click to browse</p>
        <input type="file" id="file-input" accept=".json">
    </div>

    <div class="add-form" id="add-form-container">
        <div class="input-group">
            <label>Image Title</label>
            <input type="text" id="new-title" placeholder="e.g., Urban Textures">
        </div>
        <div class="input-group">
            <label>Image Source (Path)</label>
            <input type="text" id="new-src" placeholder="e.g., images/street_01.jpg">
        </div>
        <button class="primary" onclick="addPhoto()">Add to Grid</button>
    </div>

    <div id="gallery-container"></div>

    <script>
        // --- CONFIGURATION ---
        const CONFIG_SWAP_KEY = 's'; 

        // --- STATE VARIABLES ---
        let photos = [];
        let draggedItemIndex = null;
        let isInitialLoad = true;
        let isSwapKeyHeld = false;
        let currentHoveredCard = null;

        const grid = document.getElementById('gallery-container');
        const dropzone = document.getElementById('json-dropzone');
        const fileInput = document.getElementById('file-input');
        const addForm = document.getElementById('add-form-container');
        
        // --- UI TOGGLE & HOTKEY LOGIC ---
        const modeToggle = document.getElementById('mode-toggle');
        const insertLabel = document.getElementById('insert-label');
        const swapLabel = document.getElementById('swap-label');

        function getSwapMode() {
            return modeToggle.checked || isSwapKeyHeld;
        }

        modeToggle.addEventListener('change', updateToggleVisuals);

        function updateToggleVisuals() {
            if (modeToggle.checked) {
                swapLabel.style.color = 'var(--swap-color)'; swapLabel.style.fontWeight = 'bold';
                insertLabel.style.color = 'var(--text-muted)'; insertLabel.style.fontWeight = 'normal';
            } else {
                insertLabel.style.color = 'var(--accent-hover)'; insertLabel.style.fontWeight = 'bold';
                swapLabel.style.color = 'var(--text-muted)'; swapLabel.style.fontWeight = 'normal';
            }
            updateDragVisuals();
        }

        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.key.toLowerCase() === CONFIG_SWAP_KEY) {
                isSwapKeyHeld = true;
                updateDragVisuals();
            }
        });
        
        document.addEventListener('keyup', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.key.toLowerCase() === CONFIG_SWAP_KEY) {
                isSwapKeyHeld = false;
                updateDragVisuals();
            }
        });

        function updateDragVisuals() {
            if (draggedItemIndex !== null && currentHoveredCard) {
                if (getSwapMode()) {
                    currentHoveredCard.classList.add('swap-mode');
                    currentHoveredCard.classList.remove('drag-over');
                } else {
                    currentHoveredCard.classList.add('drag-over');
                    currentHoveredCard.classList.remove('swap-mode');
                }
            }
        }

        // --- Drag & Drop JSON Import Logic ---
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropzone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) { e.preventDefault(); e.stopPropagation(); }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropzone.addEventListener(eventName, () => dropzone.classList.add('dragover'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropzone.addEventListener(eventName, () => dropzone.classList.remove('dragover'), false);
        });

        dropzone.addEventListener('drop', e => handleFiles(e.dataTransfer.files), false);
        fileInput.addEventListener('change', e => handleFiles(e.target.files));

        function handleFiles(files) {
            if (files.length === 0) return;
            const file = files[0];
            
            if (file.type !== "application/json" && !file.name.endsWith('.json')) {
                alert("Please drop a valid .json file.");
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (Array.isArray(parsed)) {
                        dropzone.style.display = 'none'; 
                        addForm.classList.add('active'); 
                        processAndLoadPhotos(parsed);
                    } else {
                        alert("The JSON must contain an array of objects.");
                    }
                } catch (err) {
                    alert("Error parsing JSON file. Is it formatted correctly?");
                }
            };
            reader.readAsText(file);
        }

        function processAndLoadPhotos(data) {
            grid.innerHTML = '<p style="color: var(--text-muted); padding: 2rem; text-align: center;">Pre-calculating geometries...</p>';
            
            Promise.all(data.map(photo => {
                return new Promise((resolve) => {
                    const img = new Image();
                    img.src = photo.src;
                    img.onload = () => { photo.aspectRatio = img.naturalWidth / img.naturalHeight; resolve(photo); };
                    img.onerror = () => { photo.aspectRatio = 1.5; resolve(photo); };
                });
            })).then(processed => {
                photos = processed;
                isInitialLoad = true;
                buildJustifiedGrid();
            });
        }

        function clearWorkspace() {
            if(confirm("Clear current workspace? Unexported changes will be lost.")) {
                photos = [];
                grid.innerHTML = '';
                dropzone.style.display = 'flex';
                addForm.classList.remove('active');
                fileInput.value = '';
            }
        }

        // --- Editor Real-time Input Logic ---
        grid.addEventListener('change', (e) => {
            const card = e.target.closest('.photo-card');
            if (!card) return;
            const index = parseInt(card.dataset.index);

            if (e.target.classList.contains('title-input')) {
                photos[index].title = e.target.value;
            } else if (e.target.classList.contains('src-input')) {
                photos[index].src = e.target.value;
                const img = new Image();
                img.src = photos[index].src;
                img.onload = () => { 
                    photos[index].aspectRatio = img.naturalWidth / img.naturalHeight; 
                    buildJustifiedGrid(); 
                };
                img.onerror = () => { 
                    photos[index].aspectRatio = 1.5; 
                    buildJustifiedGrid(); 
                };
            }
        });

        grid.addEventListener('click', (e) => {
            if (e.target.classList.contains('delete-btn')) {
                if (confirm("Remove this photo from the flow?")) {
                    const card = e.target.closest('.photo-card');
                    const index = parseInt(card.dataset.index);
                    photos.splice(index, 1);
                    buildJustifiedGrid(); 
                }
            }
        });

        function addPhoto() {
            const titleInput = document.getElementById('new-title');
            const srcInput = document.getElementById('new-src');
            
            if (!titleInput.value || !srcInput.value) {
                alert("Provide both a title and an image path.");
                return;
            }

            const newObj = { title: titleInput.value, src: srcInput.value };
            
            const img = new Image();
            img.src = newObj.src;
            img.onload = () => {
                newObj.aspectRatio = img.naturalWidth / img.naturalHeight;
                photos.push(newObj);
                buildJustifiedGrid(); 
            };
            img.onerror = () => {
                newObj.aspectRatio = 1.5;
                photos.push(newObj);
                buildJustifiedGrid();
            };

            titleInput.value = ''; srcInput.value = '';
        }

        // --- Justified Grid Builder Engine ---
        function buildJustifiedGrid() {
            grid.innerHTML = ''; 
            
            const targetImgHeight = window.innerWidth > 768 ? 350 : 200;
            const gap = 12; 
            const containerWidth = grid.clientWidth;
            const footerHeight = 85; 

            let rowPhotos = [];
            let rowAspectRatioSum = 0;

            photos.forEach((photo, index) => {
                rowPhotos.push({ ...photo, originalIndex: index });
                rowAspectRatioSum += photo.aspectRatio;

                const estimatedWidth = (rowAspectRatioSum * targetImgHeight) + ((rowPhotos.length - 1) * gap);

                if (estimatedWidth >= containerWidth) {
                    const exactImgHeight = (containerWidth - ((rowPhotos.length - 1) * gap)) / rowAspectRatioSum;
                    renderRow(rowPhotos, exactImgHeight, footerHeight);
                    rowPhotos = [];
                    rowAspectRatioSum = 0;
                }
            });

            if (rowPhotos.length > 0) {
                renderRow(rowPhotos, targetImgHeight, footerHeight, true);
            }

            isInitialLoad = false; 
        }

        function renderRow(rowPhotos, imgHeight, footerHeight, isLastRow = false) {
            const rowDiv = document.createElement('div');
            rowDiv.className = 'gallery-row';
            
            rowDiv.style.height = `${imgHeight + footerHeight}px`;

            rowPhotos.forEach((photo, i) => {
                const item = document.createElement('div');
                item.className = 'photo-card';
                item.draggable = true;
                item.dataset.index = photo.originalIndex;
                
                item.style.flex = `${photo.aspectRatio} 1 0px`;
                if (isLastRow) {
                    item.style.flex = `0 1 ${photo.aspectRatio * imgHeight}px`;
                }

                if (isInitialLoad) {
                    item.classList.add('stagger-prep');
                    setTimeout(() => {
                        item.classList.add('animate-in');
                        setTimeout(() => item.classList.remove('stagger-prep', 'animate-in'), 600);
                    }, 50 + (photo.originalIndex * 80));
                }

                item.innerHTML = `
                    <button class="delete-btn" title="Remove Photo">&times;</button>
                    <div class="card-img-wrapper" style="height: ${imgHeight}px;">
                        <img src="${photo.src}" loading="lazy" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'100\\' height=\\'150\\'><rect width=\\'100\\' height=\\'150\\' fill=\\'%23111\\'/><text x=\\'50%\\' y=\\'50%\\' dominant-baseline=\\'middle\\' text-anchor=\\'middle\\' fill=\\'%23555\\'>Broken Link</text></svg>'">
                    </div>
                    <div class="card-info">
                        <input type="text" class="title-input" value="${photo.title}" placeholder="Title">
                        <input type="text" class="src-input" value="${photo.src}" placeholder="Image Path">
                    </div>
                `;
                rowDiv.appendChild(item);
            });

            grid.appendChild(rowDiv);
        }

        window.addEventListener('resize', () => {
            if(photos.length > 0) buildJustifiedGrid();
        });

        // --- Drag & Drop Item Management ---
        grid.addEventListener('dragstart', (e) => {
            const card = e.target.closest('.photo-card');
            if (card) {
                draggedItemIndex = parseInt(card.dataset.index);
                setTimeout(() => card.classList.add('dragging'), 0);
                e.dataTransfer.effectAllowed = 'move';
            }
        });

        grid.addEventListener('dragover', (e) => {
            e.preventDefault();
            const card = e.target.closest('.photo-card');
            if (card && parseInt(card.dataset.index) !== draggedItemIndex) {
                currentHoveredCard = card;
                if (getSwapMode()) {
                    e.dataTransfer.dropEffect = 'copy';
                    card.classList.add('swap-mode');
                    card.classList.remove('drag-over');
                } else {
                    e.dataTransfer.dropEffect = 'move';
                    card.classList.add('drag-over');
                    card.classList.remove('swap-mode');
                }
            }
        });

        grid.addEventListener('dragleave', (e) => {
            const card = e.target.closest('.photo-card');
            if (card) {
                card.classList.remove('drag-over', 'swap-mode');
                currentHoveredCard = null;
            }
        });

        grid.addEventListener('drop', (e) => {
            e.preventDefault();
            const card = e.target.closest('.photo-card');
            if (!card) return;
            
            card.classList.remove('drag-over', 'swap-mode');
            const dropIndex = parseInt(card.dataset.index);

            if (draggedItemIndex !== null && draggedItemIndex !== dropIndex) {
                if (getSwapMode()) {
                    const temp = photos[draggedItemIndex];
                    photos[draggedItemIndex] = photos[dropIndex];
                    photos[dropIndex] = temp;
                } else {
                    const draggedItem = photos.splice(draggedItemIndex, 1)[0];
                    photos.splice(dropIndex, 0, draggedItem);
                }
                buildJustifiedGrid(); 
            }
            draggedItemIndex = null;
            currentHoveredCard = null;
        });

        grid.addEventListener('dragend', (e) => {
            const card = e.target.closest('.photo-card');
            if (card) card.classList.remove('dragging');
            document.querySelectorAll('.photo-card').forEach(c => c.classList.remove('drag-over', 'swap-mode'));
            draggedItemIndex = null;
            currentHoveredCard = null;
        });

        // --- Export JSON ---
        window.exportJSON = function() {
            if (photos.length === 0) {
                alert("Pipeline is empty. Nothing to export.");
                return;
            }
            const cleanPhotos = photos.map(({ title, src }) => ({ title, src }));
            const dataStr = JSON.stringify(cleanPhotos, null, 4);
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = "photos.json";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        };
    </script>
</body>
</html>
