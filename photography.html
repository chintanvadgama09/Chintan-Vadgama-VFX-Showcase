<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photography | Chintan Vadgama</title>
    <style>
        /* --- Local Fonts --- */
        @font-face {
            font-family: 'Inter';
            src: url('fonts/Inter-Light.ttf') format('truetype');
            font-weight: 300; font-style: normal; font-display: swap;
        }
        @font-face {
            font-family: 'Inter';
            src: url('fonts/Inter-Regular.ttf') format('truetype');
            font-weight: 400; font-style: normal; font-display: swap;
        }
        @font-face {
            font-family: 'Inter';
            src: url('fonts/Inter-SemiBold.ttf') format('truetype');
            font-weight: 600; font-style: normal; font-display: swap;
        }
        @font-face {
            font-family: 'Inter';
            src: url('fonts/Inter-ExtraBold.ttf') format('truetype');
            font-weight: 800; font-style: normal; font-display: swap;
        }

        /* --- Color Palette & Variables --- */
        :root {
            --bg-main: #060b0f;
            --bg-secondary: #0b171e;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --accent-teal: rgb(95, 150, 189);
            --accent-hover: #00d2d6;
            --tile-color: #7eaed1;
            
            --wipe-texture: url('images/flow.png'); 
            --wipe-texture-scale: 25vw 350%;
            --wipe-speed: 10s;
        }

        /* --- Global Styles --- */
        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden; 
        }
        a { text-decoration: none; color: var(--text-main); transition: color 0.3s ease; }

        /* --- Navigation --- */
        nav {
            position: fixed; top: 0; width: 100%; padding: 1rem 5%;
            background: rgba(10, 15, 20, 0.8); backdrop-filter: blur(10px);
            display: flex; justify-content: space-between; align-items: center;
            z-index: 1000; border-bottom: 1px solid rgba(255,255,255,0.1); overflow: hidden; 
        }
        .logo, .nav-links { position: relative; z-index: 1; }
        .logo { font-weight: 525; font-size: 1.5rem; letter-spacing: 2px; color: var(--tile-color); }
        .nav-links { display: flex; gap: 6rem; }
        .nav-links a {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 400;
            display: flex; 
            align-items: center; 
            transition: color 0.3s ease, text-shadow 0.4s ease, transform 0.3s ease;
        }
        .nav-links a:hover {
            color: rgb(250, 250, 250);
            text-shadow: 0 0 10px rgba(58, 186, 255, 1), 0 0 30px rgba(58, 186, 255, 1);
            transform: scale(1.2);
        }

        /* --- Sections --- */
        section { padding: 120px 5% 100px; min-height: 100vh; display: flex; flex-direction: column; }
        .section-title { font-size: 2.5rem; margin-bottom: 1rem; position: relative; display: inline-block; }
        .section-title::after {
            content: ''; position: absolute; left: 0; bottom: -10px;
            width: 50px; height: 3px; background-color: var(--accent-teal);
        }
        .section-subtitle { color: var(--text-muted); font-size: 1.1rem; margin-bottom: 4rem; margin-top: 1.5rem; }

        /* --- Justified Layout Container --- */
        #gallery-container {
            display: flex;
            flex-direction: column;
            gap: 12px; /* Vertical gap between rows */
            width: 100%;
        }
        
        .gallery-row {
            display: flex;
            flex-direction: row;
            gap: 12px; /* Horizontal gap between images */
            width: 100%;
        }

        .gallery-item {
            position: relative;
            cursor: pointer;
            border-radius: 4px;
            overflow: hidden;
            outline: 2px solid rgba(250, 250, 250, 0); /* Start with invisible outline */
            outline-offset: -2px;
            
            /* FIXED: Added 's' to 0.4s for the outline transition */
            transition: outline 0.4s ease, transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s ease, opacity 0.8s ease-out !important;
        }

        /* By chaining the classes, we guarantee this wins the specificity war over .fade-pop */
        .gallery-item.fade-pop.is-visible:hover {
            transform: scale(1.03) !important; /* Adjusted to 1.03 to match your previous scale, change to 1.2 if you want it larger! */
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
            
            /* FIXED: Changed alpha from 255 to 1 */
            outline: 2px solid rgba(250, 250, 250, 1);
            outline-offset: -2px;
            
            z-index: 10;
            transition-delay: 0s !important; 
        }
        
        .gallery-item img {
            width: 100%;
            height: 100%;
            display: block;
            /* object-fit isn't doing the heavy lifting anymore, JS is. This just covers sub-pixel flexbox rounding */
            object-fit: cover; 
            transition: opacity 0.3s ease;
        }

        .gallery-item:hover {
            transform: scale(1.03); 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 20px rgba(0, 210, 214, 0.6);
            z-index: 10; /* Bring above adjacent items when zoomed */
            transition-delay: 0s !important; /* Bypasses the JS entrance delay */
        }

        /* --- Lightbox Viewer --- */
        #lightbox {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(6, 11, 15, 0.98); z-index: 2000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
            backdrop-filter: blur(15px);
        }
        #lightbox.active { opacity: 1; pointer-events: auto; }
        
        .lightbox-header {
            position: absolute; top: 0; left: 0; width: 100%; padding: 2rem 5%;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 2001;
        }
        #lightbox-title {
            color: #fff; font-size: 1.2rem; font-weight: 600; letter-spacing: 2px;
            text-transform: uppercase; text-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }
        
        .close-btn {
            background: none; border: none; color: var(--text-muted); font-size: 2.5rem;
            cursor: pointer; transition: color 0.3s ease, transform 0.3s ease;
            line-height: 1; padding: 0 1rem;
        }
        .close-btn:hover { color: var(--accent-hover); transform: scale(1.1); }

        .lightbox-content {
            position: relative; width: 90%; height: 80vh;
            display: flex; justify-content: center; align-items: center;
        }
        
        #lightbox-img-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .lightbox-img-layer {
            position: absolute;
            max-width: 100%; 
            max-height: 100%; 
            border-radius: 4px;
            box-shadow: 0 10px 50px rgba(0,0,0,0.6);
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
            opacity: 0;
            transform: scale(0.95);
        }
        .lightbox-img-layer.active {
            opacity: 1;
            transform: scale(1);
        }
        
        .nav-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(10, 15, 20, 0.5); border: 1px solid rgba(255,255,255,0.1);
            color: #fff; font-size: 2rem; width: 60px; height: 60px; border-radius: 50%;
            cursor: pointer; transition: all 0.3s ease; z-index: 2001;
            display: flex; justify-content: center; align-items: center;
            backdrop-filter: blur(5px);
            line-height: 0;
            padding-bottom: 4px;
        }
        .nav-btn:hover {
            background: var(--accent-teal); color: var(--bg-main);
            box-shadow: 0 0 20px rgba(95, 150, 189, 0.5); border-color: var(--accent-teal);
        }
        #prev-btn { left: -2rem; }
        #next-btn { right: -2rem; }

        /* --- Animations & HEXTECH UI FLOW --- */
        .fade-pop {
            opacity: 0; transform: translateY(40px) scale(0.95);
            transition: opacity 0.8s ease-out, transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            will-change: opacity, transform;
        }
        .fade-pop.is-visible { opacity: 1; transform: translateY(0) scale(1); }

        nav::before {
            content: ''; position: absolute; top: 0; left: -150%; width: 180%; height: 100%;
            pointer-events: none; z-index: 0; opacity: 0.4; transform: skewX(-30deg);
            background-image: linear-gradient(90deg, transparent 0%, transparent 35%, transparent 50%, transparent 65%, transparent 100%), var(--wipe-texture);
            background-size: 100% 100%, var(--wipe-texture-scale); background-repeat: repeat-y, repeat-x;
            background-blend-mode: additive;
            -webkit-mask-image: linear-gradient(90deg, transparent 0%, transparent 35%, black 50%, transparent 65%, transparent 100%);
            mask-image: linear-gradient(90deg, transparent 0%, transparent 35%, black 50%, transparent 65%, transparent 100%);
        }
        nav.run-wipe::before { animation: hextech-wipe var(--wipe-speed) forwards cubic-bezier(0.25, 1, 1, 1); }
        @keyframes hextech-wipe { 0% { left: -150%; background-position: 0 0, 0 0; } 100% { left: 150%; background-position: 0 0, -330vw 0; } }

        /* --- Responsive Design --- */
        @media (max-width: 1024px) {
            #prev-btn { left: 0; } #next-btn { right: 0; }
        }
        @media (max-width: 768px) {
            nav { padding: 0.6rem 5%; justify-content: center; }
            .logo { display: none; }
            .nav-links { display: flex; gap: 1.5rem; flex-wrap: wrap; justify-content: center; }
            .nav-links a { font-size: 0.85rem; }
            .nav-btn { width: 45px; height: 45px; font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">Chintan Vadgama</div>
        <div class="nav-links">
            <a href="index.html#hero">Home</a>
            <a href="index.html#projects">Projects</a>
            <a href="index.html#about">About</a>
            
            <a href="index.html#contact" aria-label="Contact" title="Contact">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56a.977.977 0 0 0-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.03 21c.76 0 .99-.67.99-1.21v-3.42c0-.55-.46-1-.99-1z"/>
                </svg>
            </a>

            <a href="photography.html" aria-label="Photography" title="Photography">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.65 0-3 1.35-3 3s1.35 3 3 3 3-1.35 3-3-1.35-3-3-3z"/>
                </svg>
            </a>
        </div>
    </nav>
    
    <section id="photography">
        <h2 class="section-title fade-pop">Captured Light</h2>
        <p class="section-subtitle fade-pop">A collection of visual experiments, raw textures, and everyday scenes.</p>
        
        <div id="gallery-container"></div>
    </section>

    <div id="lightbox">
        <div class="lightbox-header">
            <span id="lightbox-title">Photo Title</span>
            <button class="close-btn" onclick="closeLightbox()">&times;</button>
        </div>
        <div class="lightbox-content">
            <button class="nav-btn" id="prev-btn" onclick="prevPhoto(event)">&#10094;</button>
            <div id="lightbox-img-container"></div>
            <button class="nav-btn" id="next-btn" onclick="nextPhoto(event)">&#10095;</button>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            
            // --- Intersection Observer (Fade-pop animations) ---
            const observerOptions = { root: null, rootMargin: '0px', threshold: 0.1 };
            let observer;
            
           function setupObserver() {
                if (observer) observer.disconnect();
                observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('is-visible');
                            
                            // NEW: Erase the stagger delay after the 800ms entrance animation finishes.
                            // This ensures your hover and un-hover react instantly.
                            setTimeout(() => {
                                entry.target.style.transitionDelay = '0s';
                            }, 800);
                        }
                    });
                }, observerOptions);

                document.querySelectorAll('.fade-pop').forEach(el => observer.observe(el));
            }
            setupObserver();

            // --- Hextech Wipe Controller ---
            const wipeCooldown = 3200; 
            const wipeNav = document.querySelector('nav');
            function fireHextechWipe() {
                wipeNav.classList.remove('run-wipe');
                void wipeNav.offsetWidth; 
                wipeNav.classList.add('run-wipe');
            }
            setTimeout(fireHextechWipe, 500);
            setInterval(fireHextechWipe, wipeCooldown);

            // --- JUSTIFIED GALLERY Layout Engine ---
            let photoData = [];
            let currentIndex = 0;
            const galleryContainer = document.getElementById('gallery-container');
            const lightbox = document.getElementById('lightbox');
            const lightboxTitle = document.getElementById('lightbox-title');

            // 1. Fetch JSON
            fetch('photos.json')
                .then(response => response.json())
                .then(data => {
                    galleryContainer.innerHTML = '<p style="color: var(--text-muted); padding: 2rem;">Pre-calculating photo geometries...</p>';
                    
                    // 2. Preload THUMBNAILS to calculate Aspect Ratios lightning fast
                    return Promise.all(data.map(photo => {
                        return new Promise((resolve) => {
                            const img = new Image();
                            img.src = photo.thumbnail; // Using thumbnail to prevent downloading 30 massive images
                            img.onload = () => {
                                photo.aspectRatio = img.naturalWidth / img.naturalHeight;
                                resolve(photo);
                            };
                            img.onerror = () => {
                                photo.aspectRatio = 1.5; // Fallback math if broken link
                                resolve(photo);
                            };
                        });
                    }));
                })
                .then(loadedData => {
                    photoData = loadedData;
                    buildJustifiedGrid();
                    
                    // Recalculate the mathematical layout when the window is resized
                    let resizeTimer;
                    window.addEventListener('resize', () => {
                        clearTimeout(resizeTimer);
                        resizeTimer = setTimeout(buildJustifiedGrid, 150);
                    });
                })
                .catch(err => {
                    galleryContainer.innerHTML = '<p style="color: var(--danger);">Error loading photos. Ensure photos.json exists and you are running a local server.</p>';
                });

            // 3. The Core Geometry Logic
            function buildJustifiedGrid() {
                galleryContainer.innerHTML = ''; // Clear container for fresh render
                
                // Set ideal target height based on screen size
                const targetRowHeight = window.innerWidth > 768 ? 500 : 200;
                const gap = 12; // Must match CSS horizontal gap
                const containerWidth = galleryContainer.clientWidth;

                let rowPhotos = [];
                let rowAspectRatioSum = 0;

                photoData.forEach((photo, index) => {
                    // Track original index so Lightbox mapping remains correct
                    rowPhotos.push({ ...photo, originalIndex: index });
                    rowAspectRatioSum += photo.aspectRatio;

                    // Calculate estimated width of this row if it were set to the targetHeight
                    const estimatedWidth = (rowAspectRatioSum * targetRowHeight) + ((rowPhotos.length - 1) * gap);

                    // If estimated width exceeds container width, the row is full!
                    if (estimatedWidth >= containerWidth) {
                        // Mathematically adjust the height so it aligns perfectly with the right edge
                        const exactHeight = (containerWidth - ((rowPhotos.length - 1) * gap)) / rowAspectRatioSum;
                        renderRow(rowPhotos, exactHeight);
                        
                        // Reset for next row
                        rowPhotos = [];
                        rowAspectRatioSum = 0;
                    }
                });

                // Render any remaining photos as the last row
                if (rowPhotos.length > 0) {
                    // We don't stretch the last row to the edge (otherwise 1 photo becomes huge). 
                    // We render it at the target height aligned left.
                    renderRow(rowPhotos, targetRowHeight, true);
                }

                setupObserver(); // Trigger entrance animations
            }

            function renderRow(photos, rowHeight, isLastRow = false) {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'gallery-row';
                // Lock row height
                rowDiv.style.height = `${rowHeight}px`;

                photos.forEach((photo, i) => {
                    const item = document.createElement('div');
                    item.className = 'gallery-item fade-pop';
                    
                    // Flexbox takes over: It distributes the remaining widths perfectly based on the exact aspect ratio
                    item.style.flex = `${photo.aspectRatio} 1 0px`;
                    
                    // If it's the last row, prevent stretching it to the edge
                    if (isLastRow) {
                        item.style.flex = `0 1 ${photo.aspectRatio * rowHeight}px`;
                    }

                    // Stagger animation based on index
                    item.style.transitionDelay = `${(i % 5) * 0.1}s`;
                    item.onclick = () => openLightbox(photo.originalIndex);
                    
                    // USING THUMBNAIL for the grid view
                    item.innerHTML = `<img src="${photo.thumbnail}" alt="${photo.title}" loading="lazy">`;
                    rowDiv.appendChild(item);
                });

                galleryContainer.appendChild(rowDiv);
            }

            // --- Lightbox Controls ---
            window.openLightbox = function(index) {
                currentIndex = index;
                updateLightbox(false); 
                lightbox.classList.add('active');
                document.body.style.overflow = 'hidden'; 
            };

            window.closeLightbox = function() {
                lightbox.classList.remove('active');
                document.body.style.overflow = 'auto';
            };

            window.nextPhoto = function(e) {
                if(e) e.stopPropagation();
                currentIndex = (currentIndex + 1) % photoData.length;
                updateLightbox(true);
            };

            window.prevPhoto = function(e) {
                if(e) e.stopPropagation();
                currentIndex = (currentIndex - 1 + photoData.length) % photoData.length;
                updateLightbox(true);
            };

            function updateLightbox(animate) {
                lightboxTitle.textContent = photoData[currentIndex].title;
                const container = document.getElementById('lightbox-img-container');
                const oldImg = container.querySelector('.lightbox-img-layer.active');
                
                // When we create this new element, we pull the HIGH RES .src link!
                // It will only download at this exact moment.
                const newImg = document.createElement('img');
                newImg.src = photoData[currentIndex].src; 
                newImg.alt = photoData[currentIndex].title;
                newImg.className = 'lightbox-img-layer';
                
                if (!animate) {
                    newImg.classList.add('active');
                    container.innerHTML = '';
                    container.appendChild(newImg);
                } else {
                    container.appendChild(newImg);
                    void newImg.offsetWidth; // DOM reflow
                    newImg.classList.add('active');
                    if (oldImg) {
                        oldImg.classList.remove('active');
                        setTimeout(() => oldImg.remove(), 500); 
                    }
                }
            }

            // Keyboard support & Outside Click
            document.addEventListener('keydown', (e) => {
                if (!lightbox.classList.contains('active')) return;
                if (e.key === 'ArrowRight') nextPhoto();
                if (e.key === 'ArrowLeft') prevPhoto();
                if (e.key === 'Escape') closeLightbox();
            });

            lightbox.addEventListener('click', (e) => {
                if(e.target === lightbox || e.target.classList.contains('lightbox-content') || e.target.id === 'lightbox-img-container') {
                    closeLightbox();
                }
            });
            
            // Swipe support for mobile
            let touchStartX = 0;
            lightbox.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX);
            lightbox.addEventListener('touchend', e => {
                let touchEndX = e.changedTouches[0].screenX;
                if (touchEndX < touchStartX - 50) nextPhoto();
                if (touchEndX > touchStartX + 50) prevPhoto();
            });
        });
    </script>
</body>
</html>
