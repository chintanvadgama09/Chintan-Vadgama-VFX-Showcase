<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photography | Chintan Vadgama</title>
    <style>
        /* --- Local Fonts (Inherited from index.html) --- */
        @font-face {
            font-family: 'Inter';
            src: url('fonts/Inter-Light.ttf') format('truetype');
            font-weight: 300; font-style: normal; font-display: swap;
        }
        @font-face {
            font-family: 'Inter';
            src: url('fonts/Inter-Regular.ttf') format('truetype');
            font-weight: 400; font-style: normal; font-display: swap;
        }
        @font-face {
            font-family: 'Inter';
            src: url('fonts/Inter-SemiBold.ttf') format('truetype');
            font-weight: 600; font-style: normal; font-display: swap;
        }
        @font-face {
            font-family: 'Inter';
            src: url('fonts/Inter-ExtraBold.ttf') format('truetype');
            font-weight: 800; font-style: normal; font-display: swap;
        }

        /* --- Color Palette & Variables (Inherited from index.html) --- */
        :root {
            --bg-main: #05090d;
            --bg-card: #0a1117;
            --border-color: rgba(255, 255, 255, 0.08);
            
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --text-dark: #64748b;
            
            --accent: #38d9a9;
            --accent-hover: #72dfbe;
            --accent-transparent: rgba(56, 217, 169, 0.15);
            
            --transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* --- Global Styles --- */
        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden; 
        }
        a { text-decoration: none; color: inherit; transition: var(--transition); }
        
        .container {
            max-width: 1900px;
            margin: 0 auto;
            padding: 0 5%;
        }

        /* --- Navigation --- */
        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0.5rem 5%; background: rgba(5, 9, 13, 0.85);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            position: fixed; width: 100%; top: 0; z-index: 1000;
            box-shadow: 0 0px 50px rgba(5, 9, 13, 0.85);
        }
        .logo { display: flex; align-items: center; gap: 1rem; }
        
        .cv-logo-img {
            height: 30px;
            width: auto;
            object-fit: contain;
        }

        .logo-text { display: flex; flex-direction: column; line-height: 1.1; }
        .logo-name { font-size: 1.1rem; font-weight: 600; letter-spacing: 1px; }
        .logo-title { font-size: 0.8rem; color: var(--text-dark); letter-spacing: 0.5px; }
        
        .nav-links { display: flex; gap: 2.5rem; }
        .nav-links a {
            font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px;
            font-weight: 600; color: var(--text-muted); position: relative;
        }
        .nav-links a:hover, .nav-links a.active { color: var(--accent); }
        .nav-links a.active::after {
            content: ''; position: absolute; bottom: -8px; left: 50%;
            transform: translateX(-50%); width: 4px; height: 4px;
            background-color: var(--accent); border-radius: 50%; transition: all 0.3s ease;
        }

        .btn-outline {
            border: 1px solid var(--border-color); padding: 0.6rem 1.5rem;
            border-radius: 50px; font-size: 0.8rem; font-weight: 600;
            letter-spacing: 1px; color: var(--accent); display: flex;
            align-items: center; justify-content: center; gap: 0.5rem; cursor: pointer;
        }
        .btn-outline:hover { border-color: var(--accent); background: var(--accent-transparent); }

        /* --- Photography Section Headers --- */
        section { padding: 130px 0 80px; position: relative; min-height: 100vh; }
        .section-header-centered { padding-top: 100px; text-align: center; margin: 1rem auto 4rem; }
        .section-header-centered .section-tag {
            color: var(--accent); font-size: 1rem; font-weight: 600;
            letter-spacing: 1px; text-transform: uppercase; display: inline-block; margin-bottom: 0.5rem;
        }
        .section-header-centered h2 {
            font-size: 1.2rem; font-weight: 400; color: var(--text-muted);
        }

        /* --- Justified Layout Container --- */
        #gallery-container {
            display: flex; flex-direction: column; gap: 12px; width: 100%;
        }
        .gallery-row {
            display: flex; flex-direction: row; gap: 12px; width: 100%;
        }
        .gallery-item {
            position: relative; cursor: pointer; border-radius: 8px; overflow: hidden;
            border: 1px solid var(--border-color);
            background-color: var(--bg-card);
            transition: var(--transition);
        }
        .gallery-item img {
            width: 100%; height: 100%; display: block; object-fit: cover; 
            transition: opacity 0.3s ease;
        }
        .gallery-item:hover {
            border-color: var(--accent);
            transform: scale(1.02); 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            z-index: 10; 
            transition-delay: 0s !important; 
        }

        /* --- Lightbox Viewer --- */
        #lightbox {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(5, 9, 13, 0.95); z-index: 2000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
        }
        #lightbox.active { opacity: 1; pointer-events: auto; }
        
        .lightbox-header {
            position: absolute; top: 0; left: 0; width: 100%; padding: 2rem 5%;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 2001;
        }
        #lightbox-title {
            color: var(--text-main); font-size: 1rem; font-weight: 600; letter-spacing: 2px;
            text-transform: uppercase;
        }
        
        .close-btn {
            background: none; border: none; color: var(--text-muted); font-size: 2.5rem;
            cursor: pointer; transition: var(--transition); line-height: 1; padding: 0 1rem;
        }
        .close-btn:hover { color: var(--accent); transform: scale(1.1); }

        .lightbox-content {
            position: relative; width: 90%; height: 80vh;
            display: flex; justify-content: center; align-items: center;
        }
        
        #lightbox-img-container {
            position: relative; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
        }

        .lightbox-img-layer {
            position: absolute; max-width: 100%; max-height: 100%; 
            border-radius: 8px; box-shadow: 0 10px 50px rgba(0,0,0,0.6);
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
            opacity: 0; transform: scale(0.95); touch-action: none;
        }
        .lightbox-img-layer.active { opacity: 1; transform: scale(1); }
        
        .nav-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: var(--bg-card); border: 1px solid var(--border-color);
            color: var(--text-main); font-size: 1.5rem; width: 50px; height: 50px; border-radius: 50%;
            cursor: pointer; transition: var(--transition); z-index: 2001;
            display: flex; justify-content: center; align-items: center;
            line-height: 0; padding-bottom: 4px;
        }
        .nav-btn:hover {
            background: var(--accent-transparent); color: var(--accent);
            border-color: var(--accent);
        }
        #prev-btn { left: -2rem; }
        #next-btn { right: -2rem; }

        /* --- Footer --- */
        footer {
            border-top: 1px solid var(--border-color); padding: 3rem 5%;
            display: flex; justify-content: space-between; align-items: center;
            background-color: var(--bg-main);
        }
        .footer-text { color: var(--text-dark); font-size: 0.9rem; }
        .social-icons { display: flex; gap: 1.5rem; }
        .social-icons a { color: var(--text-dark); }
        .social-icons a:hover { color: var(--accent); }

        /* --- Animations --- */
        .fade-pop {
            opacity: 0; transform: translateY(30px);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
            will-change: opacity, transform;
        }
        .fade-pop.is-visible { opacity: 1; transform: translateY(0); }
        .delay-1 { transition-delay: 0.1s; }

        /* --- Responsive Design --- */
        @media (max-width: 1024px) {
            #prev-btn { left: 0; } #next-btn { right: 0; }
            .nav-links { gap: 1.5rem; }
        }
        @media (max-width: 768px) {
            /* Main Nav Adjustments */
            nav {
                flex-wrap: wrap;
                padding: 0.8rem 5%;
            }
            nav > .btn-outline {
                display: none; 
            }
            .logo-text {
                display: none; 
            }
            .cv-logo-img {
                height: 35px; 
            }
            .nav-links {
                width: 100%;
                justify-content: space-between;
                gap: 0.5rem;
                margin-top: 1rem;
                overflow-x: auto;
            }
            .nav-links a {
                font-size: 0.75rem;
            }

            /* Photography Specifics & Footer */
            .nav-btn { 
                width: 45px; 
                height: 45px; 
                font-size: 1.2rem; 
            }
            footer { 
                flex-direction: column; 
                gap: 1rem; 
                text-align: center; 
            }
        }
    </style>
</head>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            
            // --- Global Configurations & States ---
            const INITIAL_CLICK_ZOOM = 2.5; 
            const MAX_ZOOM = 8.0;           
            const ZOOM_SPEED = 1;        
            
            let currentZoom = 1.0;
            let isZoomed = false;
            let isPanning = false;
            let startX = 0, startY = 0;
            let translateX = 0, translateY = 0;
            let pointerDownX = 0, pointerDownY = 0;

            // --- Intersection Observer (Fade-pop animations) ---
            const observerOptions = { root: null, rootMargin: '0px', threshold: 0.1 };
            let observer;
            
           function setupObserver() {
                if (observer) observer.disconnect();
                observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('is-visible');
                            // Remove delay after initial pop to prevent glitching on hover
                            setTimeout(() => {
                                entry.target.style.transitionDelay = '0s';
                            }, 800);
                        }
                    });
                }, observerOptions);

                document.querySelectorAll('.fade-pop').forEach(el => observer.observe(el));
            }

            // --- JUSTIFIED GALLERY Layout Engine ---
            let photoData = [];
            let currentIndex = 0;
            const galleryContainer = document.getElementById('gallery-container');
            const lightbox = document.getElementById('lightbox');
            const lightboxTitle = document.getElementById('lightbox-title');

            // 1. Fetch JSON
            fetch('photos.json')
                .then(response => response.json())
                .then(data => {
                    galleryContainer.innerHTML = '<p style="color: var(--text-muted); padding: 2rem; text-align: center;">Pre-calculating photo geometries...</p>';
                    
                    return Promise.all(data.map(photo => {
                        return new Promise((resolve) => {
                            const img = new Image();
                            img.src = photo.thumbnail; 
                            img.onload = () => {
                                photo.aspectRatio = img.naturalWidth / img.naturalHeight;
                                resolve(photo);
                            };
                            img.onerror = () => {
                                photo.aspectRatio = 1.5; 
                                resolve(photo);
                            };
                        });
                    }));
                })
                .then(loadedData => {
                    photoData = loadedData;
                    buildJustifiedGrid();
                    
                    let resizeTimer;
                    window.addEventListener('resize', () => {
                        clearTimeout(resizeTimer);
                        resizeTimer = setTimeout(buildJustifiedGrid, 150);
                    });
                })
                .catch(err => {
                    galleryContainer.innerHTML = '<p style="color: #ff6b6b; text-align: center;">Error loading photos. Ensure photos.json exists and you are running a local server.</p>';
                });

            // 2. The Core Geometry Logic
            function buildJustifiedGrid() {
                galleryContainer.innerHTML = ''; 
                
                const targetRowHeight = window.innerWidth > 768 ? 500 : 200;
                const gap = 12; 
                const containerWidth = galleryContainer.clientWidth;

                let rowPhotos = [];
                let rowAspectRatioSum = 0;

                photoData.forEach((photo, index) => {
                    rowPhotos.push({ ...photo, originalIndex: index });
                    rowAspectRatioSum += photo.aspectRatio;

                    const estimatedWidth = (rowAspectRatioSum * targetRowHeight) + ((rowPhotos.length - 1) * gap);

                    if (estimatedWidth >= containerWidth) {
                        const exactHeight = (containerWidth - ((rowPhotos.length - 1) * gap)) / rowAspectRatioSum;
                        renderRow(rowPhotos, exactHeight);
                        
                        rowPhotos = [];
                        rowAspectRatioSum = 0;
                    }
                });

                if (rowPhotos.length > 0) {
                    renderRow(rowPhotos, targetRowHeight, true);
                }

                setupObserver(); 
            }

            function renderRow(photos, rowHeight, isLastRow = false) {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'gallery-row';
                rowDiv.style.height = `${rowHeight}px`;

                photos.forEach((photo, i) => {
                    const item = document.createElement('div');
                    item.className = 'gallery-item fade-pop';
                    
                    item.style.flex = `${photo.aspectRatio} 1 0px`;
                    
                    if (isLastRow) {
                        item.style.flex = `0 1 ${photo.aspectRatio * rowHeight}px`;
                    }

                    // Stagger the initial fade in
                    item.style.transitionDelay = `${(i % 5) * 0.1}s`;
                    item.onclick = () => openLightbox(photo.originalIndex);
                    
                    item.innerHTML = `<img src="${photo.thumbnail}" alt="${photo.title}" loading="lazy">`;
                    rowDiv.appendChild(item);
                });

                galleryContainer.appendChild(rowDiv);
            }

            // --- Lightbox Controls ---
            window.openLightbox = function(index) {
                currentIndex = index;
                updateLightbox(false); 
                lightbox.classList.add('active');
                document.body.style.overflow = 'hidden'; 
            };

            window.closeLightbox = function() {
                lightbox.classList.remove('active');
                document.body.style.overflow = 'auto';
            };

            window.nextPhoto = function(e) {
                if(e) e.stopPropagation();
                currentIndex = (currentIndex + 1) % photoData.length;
                updateLightbox(true);
            };

            window.prevPhoto = function(e) {
                if(e) e.stopPropagation();
                currentIndex = (currentIndex - 1 + photoData.length) % photoData.length;
                updateLightbox(true);
            };

            function updateLightbox(animate) {
                lightboxTitle.textContent = photoData[currentIndex].title || 'Untitled';
                const container = document.getElementById('lightbox-img-container');
                const oldImg = container.querySelector('.lightbox-img-layer.active');
                
                const newImg = document.createElement('img');
                newImg.src = photoData[currentIndex].src || photoData[currentIndex].thumbnail; 
                newImg.alt = photoData[currentIndex].title;
                newImg.className = 'lightbox-img-layer';
                
                // --- Zoom, Pan & Scroll Logic Setup ---
                newImg.style.cursor = 'zoom-in';
                isZoomed = false;
                currentZoom = 1.0;
                translateX = 0;
                translateY = 0;

                newImg.addEventListener('dragstart', e => e.preventDefault());

                newImg.addEventListener('pointerdown', (e) => {
                    pointerDownX = e.clientX;
                    pointerDownY = e.clientY;

                    if (isZoomed) {
                        isPanning = true;
                        startX = e.clientX - translateX;
                        startY = e.clientY - translateY;
                        newImg.style.cursor = 'grabbing';
                        newImg.style.transition = 'none'; 
                        newImg.setPointerCapture(e.pointerId); 
                    }
                });

                newImg.addEventListener('pointermove', (e) => {
                    if (!isPanning || !isZoomed) return;
                    translateX = e.clientX - startX;
                    translateY = e.clientY - startY;
                    newImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${currentZoom})`;
                });

                newImg.addEventListener('pointerup', (e) => {
                    if (isPanning) {
                        isPanning = false;
                        newImg.style.cursor = 'grab';
                        newImg.style.transition = 'opacity 0.5s ease-in-out, transform 0.5s ease-in-out';
                        newImg.releasePointerCapture(e.pointerId);
                    }
                });

                newImg.addEventListener('click', (e) => {
                    const dist = Math.hypot(e.clientX - pointerDownX, e.clientY - pointerDownY);
                    if (dist > 5) return; 

                    if (!isZoomed) {
                        isZoomed = true;
                        currentZoom = INITIAL_CLICK_ZOOM;
                        const rect = newImg.getBoundingClientRect();
                        
                        const x = ((e.clientX - rect.left) / rect.width) * 100;
                        const y = ((e.clientY - rect.top) / rect.height) * 100;
                        
                        newImg.style.transformOrigin = `${x}% ${y}%`;
                        newImg.style.transform = `translate(0px, 0px) scale(${currentZoom})`;
                        newImg.style.cursor = 'grab';
                    } else {
                        isZoomed = false;
                        currentZoom = 1.0;
                        translateX = 0;
                        translateY = 0;
                        newImg.style.transform = ''; 
                        newImg.style.cursor = 'zoom-in';
                    }
                });

                newImg.addEventListener('wheel', (e) => {
                    e.preventDefault();

                    if (!isZoomed && e.deltaY > 0) return;

                    if (!isZoomed) {
                        isZoomed = true;
                        const rect = newImg.getBoundingClientRect();
                        const x = ((e.clientX - rect.left) / rect.width) * 100;
                        const y = ((e.clientY - rect.top) / rect.height) * 100;
                        newImg.style.transformOrigin = `${x}% ${y}%`;
                        currentZoom = 1.0;
                    }

                    const zoomDelta = e.deltaY < 0 ? ZOOM_SPEED : -ZOOM_SPEED;
                    currentZoom = Math.min(Math.max(currentZoom + zoomDelta, 1.0), MAX_ZOOM);

                    if (currentZoom === 1.0) {
                        isZoomed = false;
                        translateX = 0;
                        translateY = 0;
                        newImg.style.transform = ''; 
                        newImg.style.cursor = 'zoom-in';
                    } else {
                        newImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${currentZoom})`;
                        newImg.style.cursor = 'grab';
                    }
                }, { passive: false });

                if (!animate) {
                    newImg.classList.add('active');
                    container.innerHTML = '';
                    container.appendChild(newImg);
                } else {
                    container.appendChild(newImg);
                    void newImg.offsetWidth; 
                    newImg.classList.add('active');
                    if (oldImg) {
                        oldImg.classList.remove('active');
                        oldImg.style.pointerEvents = 'none'; 
                        setTimeout(() => oldImg.remove(), 500); 
                    }
                }
            }

            // Keyboard support & Outside Click
            document.addEventListener('keydown', (e) => {
                if (!lightbox.classList.contains('active')) return;
                if (e.key === 'ArrowRight') nextPhoto();
                if (e.key === 'ArrowLeft') prevPhoto();
                if (e.key === 'Escape') closeLightbox();
            });

            lightbox.addEventListener('click', (e) => {
                if(e.target === lightbox || e.target.classList.contains('lightbox-content') || e.target.id === 'lightbox-img-container') {
                    closeLightbox();
                }
            });
            
            // Swipe support for mobile
            let touchStartX = 0;
            lightbox.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX);
            lightbox.addEventListener('touchend', e => {
                if (isZoomed) return; 
                let touchEndX = e.changedTouches[0].screenX;
                if (touchEndX < touchStartX - 50) nextPhoto();
                if (touchEndX > touchStartX + 50) prevPhoto();
            });
        });
    </script>
</body>
</html>
