<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV JSON Editor</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        main: '#060b0f',
                        secondary: '#0b171e',
                        teal: 'rgb(95, 150, 189)',
                        hover: '#00d2d6',
                        muted: '#94a3b8'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom scrollbar matching the dark theme */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #060b0f; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: rgb(95, 150, 189); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #00d2d6; }
        
        .editable-cell {
            outline: none;
            min-height: 24px;
            padding: 0.5rem;
            border: 1px solid transparent;
            transition: all 0.3s ease;
            border-radius: 0.25rem;
            word-break: break-all;
            color: #ffffff;
        }
        .editable-cell:focus {
            border-color: #00d2d6;
            background-color: #0b171e;
            box-shadow: 0 0 10px rgba(0, 210, 214, 0.2);
        }
        .editable-cell:hover:not(:focus) {
            background-color: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.1);
        }

        /* Core Theme Buttons */
        .btn-theme {
            border: 2px solid rgb(95, 150, 189);
            color: rgb(95, 150, 189);
            border-radius: 4px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-theme:hover {
            background-color: rgb(95, 150, 189);
            color: #060b0f;
            box-shadow: 0 0px 15px rgba(126, 174, 209, 0.6);
            transform: translateY(-1px);
        }

        /* Drag and Drop Overlay VFX */
        #dragOverlay {
            position: fixed;
            inset: 0;
            background: rgba(6, 11, 15, 0.9);
            backdrop-filter: blur(8px);
            z-index: 5000;
            display: none;
            place-items: center;
            border: 4px dashed #00d2d6;
            transition: all 0.3s ease;
        }
        .drag-over #dragOverlay {
            display: grid;
            animation: pulseOverlay 2s infinite;
        }

        /* --- Animations --- */
        @keyframes fadeInSlideUp {
            0% {
                opacity: 0;
                transform: translateY(15px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes pulseOverlay {
            0% { border-color: rgba(0, 210, 214, 0.5); }
            50% { border-color: rgba(0, 210, 214, 1); }
            100% { border-color: rgba(0, 210, 214, 0.5); }
        }

        .animate-row {
            opacity: 0;
            animation: fadeInSlideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .animate-empty-state {
            animation: fadeInSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="bg-main text-white font-sans h-screen flex flex-col">

    <div id="dragOverlay">
        <div class="text-center text-hover">
            <svg class="w-20 h-20 mx-auto mb-4 animate-bounce drop-shadow-[0_0_15px_rgba(0,210,214,0.5)]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
            <h2 class="text-4xl font-extrabold mb-2 tracking-tight">Drop JSON or CSV Here</h2>
            <p class="text-muted text-lg">Release to instantly import your data</p>
        </div>
    </div>

    <header class="bg-secondary border-b border-white/10 shadow-sm px-6 py-4 flex items-center justify-between shrink-0">
        <div class="flex items-center gap-3">
            <div class="border border-teal p-2 rounded-lg text-teal shadow-[0_0_10px_rgba(95,150,189,0.2)]">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"></path></svg>
            </div>
            <h1 class="text-xl font-bold text-white tracking-tight">CV JSON Editor</h1>
        </div>
        
        <div class="flex items-center gap-4">
            <input type="file" id="fileInput" accept=".json" class="hidden">
            <input type="file" id="csvInput" accept=".csv" class="hidden">
            
            <button onclick="document.getElementById('csvInput').click()" class="btn-theme px-4 py-2 flex items-center gap-2 text-sm shadow-sm bg-transparent">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                Import CSV
            </button>
            <button onclick="document.getElementById('fileInput').click()" class="btn-theme px-4 py-2 flex items-center gap-2 text-sm shadow-sm bg-transparent">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                Import JSON
            </button>
            <button onclick="exportCSV()" class="btn-theme px-4 py-2 flex items-center gap-2 text-sm shadow-sm bg-teal text-main !border-teal hover:!bg-hover hover:!text-main hover:!border-hover">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                Export CSV
            </button>
            <button onclick="exportJSON()" class="btn-theme px-4 py-2 flex items-center gap-2 text-sm shadow-sm bg-teal text-main !border-teal hover:!bg-hover hover:!text-main hover:!border-hover">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                Export JSON
            </button>
        </div>
    </header>

    <main class="flex-1 overflow-auto p-6 bg-main">
        <div class="bg-secondary rounded-xl shadow-lg border border-white/10 flex flex-col min-h-full overflow-hidden">
            
            <div class="px-5 py-4 border-b border-white/10 flex gap-4 bg-secondary">
                <button onclick="addRow()" class="px-4 py-1.5 bg-white/5 text-teal border border-teal/30 rounded-md hover:bg-teal/10 hover:border-teal hover:shadow-[0_0_10px_rgba(95,150,189,0.3)] font-medium text-sm transition-all flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    Add Row
                </button>
                <button onclick="addColumn()" class="px-4 py-1.5 bg-white/5 text-teal border border-teal/30 rounded-md hover:bg-teal/10 hover:border-teal hover:shadow-[0_0_10px_rgba(95,150,189,0.3)] font-medium text-sm transition-all flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    Add Column
                </button>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse" id="jsonTable">
                    <thead>
                        <tr id="tableHead" class="bg-main border-b border-white/10 text-muted text-sm uppercase tracking-wider">
                            </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-white/5 text-sm">
                        </tbody>
                </table>
            </div>
            
            <div id="emptyState" class="hidden flex-col items-center justify-center py-20 text-muted animate-empty-state">
                <svg class="w-20 h-20 mb-4 text-white/10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                <p class="text-xl font-semibold text-white">No data to display</p>
                <p class="text-sm mt-2">Import a JSON/CSV file or add a row to get started.</p>
            </div>
        </div>
    </main>

    <a id="downloadAnchor" class="hidden"></a>

    <script>
        // Application State
        let state = [
            { id: 1, name: "Sample User", roles: ["admin", "editor"], active: true },
            { id: 2, name: "Guest", roles: ["viewer"], active: false }
        ];
        let columns = [];
        
        // Drag & Drop State
        let draggedRowIndex = null;
        let dragOverRowIndex = null;

        // Initialize App
        function init() {
            renderTable();
            setupDragAndDrop();
            
            // Setup File Importers (Click)
            document.getElementById('fileInput').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) handleFileUpload(file, 'json');
                e.target.value = ''; // Reset input
            });

            document.getElementById('csvInput').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) handleFileUpload(file, 'csv');
                e.target.value = ''; // Reset input
            });
        }

        // Setup File Drag and Drop Overlay
        function setupDragAndDrop() {
            const dropZone = document.body;
            const dragOverlay = document.getElementById('dragOverlay');

            dropZone.addEventListener('dragover', (e) => {
                // Ensure we are dragging a file, not a row
                if (e.dataTransfer.types.includes('Files')) {
                    e.preventDefault();
                    document.body.classList.add('drag-over');
                }
            });

            dropZone.addEventListener('dragleave', (e) => {
                e.preventDefault();
                if (e.target === dragOverlay || e.target === dropZone) {
                    document.body.classList.remove('drag-over');
                }
            });

            dropZone.addEventListener('drop', (e) => {
                document.body.classList.remove('drag-over');
                if (e.dataTransfer.files.length > 0) {
                    e.preventDefault();
                    const file = e.dataTransfer.files[0];
                    if (file.name.endsWith('.json')) {
                        handleFileUpload(file, 'json');
                    } else if (file.name.endsWith('.csv')) {
                        handleFileUpload(file, 'csv');
                    } else {
                        alert("Please drop a valid JSON or CSV file.");
                    }
                }
            });
        }

        // Shared File Upload Handler
        function handleFileUpload(file, type) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const result = event.target.result;
                try {
                    if (type === 'json') {
                        let importedData = JSON.parse(result);
                        if (!Array.isArray(importedData)) importedData = [importedData];
                        state = importedData;
                    } else if (type === 'csv') {
                        state = parseCSVToJSON(result);
                    }
                    // Reset table with new data to re-trigger animations
                    document.getElementById('tableBody').innerHTML = ''; 
                    setTimeout(renderTable, 50); 
                } catch (error) {
                    alert("Error parsing file. Please ensure it's a valid format.");
                    console.error(error);
                }
            };
            reader.readAsText(file);
        }

        // Robust CSV Parser (Handles Commas and Quotes inside cells correctly)
        function parseCSVToJSON(text) {
            let p = '', row = [''], ret = [row], i = 0, r = 0, s = !0, l;
            for (l of text) {
                if ('"' === l) {
                    if (s && l === p) row[i] += l;
                    s = !s;
                } else if (',' === l && s) l = row[++i] = '';
                else if ('\n' === l && s) {
                    if ('\r' === p) row[i] = row[i].slice(0, -1);
                    row = ret[++r] = [l = '']; i = 0;
                } else row[i] += l;
                p = l;
            }
            
            // Clean up trailing empty row
            if (ret[ret.length - 1].length === 1 && ret[ret.length - 1][0] === '') ret.pop();

            if (ret.length < 2) return [];

            const headers = ret[0].map(h => h.trim());
            const data = [];

            for (let j = 1; j < ret.length; j++) {
                let obj = {};
                for (let k = 0; k < headers.length; k++) {
                    let val = ret[j][k] !== undefined ? ret[j][k].trim() : "";
                    
                    if (val !== "") {
                        if (!isNaN(val) && val.trim() !== "") {
                            val = Number(val);
                        } else if (val.toLowerCase() === "true") {
                            val = true;
                        } else if (val.toLowerCase() === "false") {
                            val = false;
                        } else if (val.toLowerCase() === "null") {
                            val = null;
                        }
                    }
                    obj[headers[k]] = val;
                }
                data.push(obj);
            }
            return data;
        }

        // Extract all unique keys from the state
        function updateColumns() {
            const keySet = new Set();
            state.forEach(row => {
                if (row && typeof row === 'object' && !Array.isArray(row)) {
                    Object.keys(row).forEach(key => keySet.add(key));
                }
            });
            columns = Array.from(keySet);
        }

        // Format cell content for display
        function formatForDisplay(val) {
            if (val === null) return "null";
            if (typeof val === 'object') return JSON.stringify(val);
            return val;
        }

        // Render the UI based on state
        function renderTable() {
            const tableHead = document.getElementById('tableHead');
            const tableBody = document.getElementById('tableBody');
            const emptyState = document.getElementById('emptyState');
            const jsonTable = document.getElementById('jsonTable');

            if (state.length === 0 && columns.length === 0) {
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
                jsonTable.classList.add('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');
                jsonTable.classList.remove('hidden');
            }

            updateColumns();

            // Render Header
            let headHtml = `<th class="px-4 py-3 w-16 font-semibold border-r border-white/5">Row</th>`;
            columns.forEach(col => {
                headHtml += `<th class="px-4 py-3 font-semibold border-r border-white/5">${col}</th>`;
            });
            headHtml += `<th class="px-4 py-3 w-32 text-center font-semibold">Actions</th>`;
            tableHead.innerHTML = headHtml;

            // Render Body
            let bodyHtml = '';
            state.forEach((row, rowIndex) => {
                const animDelay = Math.min(rowIndex * 0.04, 0.5);

                bodyHtml += `<tr class="group hover:bg-white/5 transition border-b border-white/5 relative bg-secondary animate-row" 
                                 style="animation-delay: ${animDelay}s;"
                                 draggable="true" 
                                 ondragstart="handleRowDragStart(event, ${rowIndex})" 
                                 ondragover="handleRowDragOver(event, ${rowIndex})" 
                                 ondragleave="handleRowDragLeave(event)"
                                 ondrop="handleRowDrop(event, ${rowIndex})" 
                                 ondragend="handleRowDragEnd(event)">`;
                
                // Row Number + Drag Handle
                bodyHtml += `<td class="px-4 py-2 border-r border-white/5 text-muted font-mono text-xs font-semibold text-center cursor-move" title="Drag to reorder">
                    <div class="flex items-center justify-center gap-2">
                        <svg class="w-4 h-4 text-white/20 group-hover:text-teal/60 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8h16M4 16h16"></path></svg>
                        ${rowIndex + 1}
                    </div>
                </td>`;
                
                columns.forEach(col => {
                    const val = row[col] !== undefined ? row[col] : "";
                    const displayVal = formatForDisplay(val);
                    const safeVal = String(displayVal).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    
                    bodyHtml += `
                        <td class="border-r border-white/5 align-top">
                            <div class="editable-cell" 
                                 contenteditable="true" 
                                 onfocus="this.closest('tr').setAttribute('draggable', false)"
                                 onblur="this.closest('tr').setAttribute('draggable', true); handleCellEdit(${rowIndex}, '${col}', this)"
                                 onkeydown="handleKeydown(event, this)">${safeVal}</div>
                        </td>`;
                });

                // Actions Column
                bodyHtml += `
                    <td class="px-4 py-2 text-center align-middle">
                        <div class="flex items-center justify-center gap-3 opacity-0 group-hover:opacity-100 transition-opacity">
                            <button onclick="insertRow(${rowIndex}, 0)" class="text-muted hover:text-hover hover:drop-shadow-[0_0_8px_rgba(0,210,214,0.5)] transition-all" title="Add Row Above">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 14H3M21 20H3M12 10V3M8 7l4-4 4 4"/></svg>
                            </button>
                            <button onclick="insertRow(${rowIndex}, 1)" class="text-muted hover:text-hover hover:drop-shadow-[0_0_8px_rgba(0,210,214,0.5)] transition-all" title="Add Row Below">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10H3M21 4H3M12 14v7M8 17l4 4 4-4"/></svg>
                            </button>
                            <button onclick="deleteRow(${rowIndex})" class="text-muted hover:text-red-400 hover:drop-shadow-[0_0_8px_rgba(248,113,113,0.5)] transition-all" title="Delete Row">
                                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2m4 0H4"></path></svg>
                            </button>
                        </div>
                    </td>`;
                bodyHtml += `</tr>`;
            });
            tableBody.innerHTML = bodyHtml;
        }

        // --- ROW DRAG AND DROP LOGIC --- //

        function handleRowDragStart(e, index) {
            draggedRowIndex = index;
            e.dataTransfer.effectAllowed = 'move';
            setTimeout(() => {
                e.target.classList.add('opacity-30', 'bg-teal/5');
            }, 10);
        }

        function handleRowDragOver(e, index) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            
            const tr = e.currentTarget;
            const rect = tr.getBoundingClientRect();
            const midY = rect.top + rect.height / 2;
            
            tr.parentElement.querySelectorAll('tr').forEach(row => {
                row.classList.remove('border-t-2', 'border-t-hover', 'border-b-2', 'border-b-hover');
            });

            if (e.clientY < midY) {
                dragOverRowIndex = index;
                tr.classList.add('border-t-2', 'border-t-hover');
            } else {
                dragOverRowIndex = index + 1;
                tr.classList.add('border-b-2', 'border-b-hover');
            }
        }

        function handleRowDragLeave(e) {
            e.currentTarget.classList.remove('border-t-2', 'border-t-hover', 'border-b-2', 'border-b-hover');
        }

        function handleRowDrop(e, index) {
            e.preventDefault();
            e.currentTarget.classList.remove('border-t-2', 'border-t-hover', 'border-b-2', 'border-b-hover');
            
            if (draggedRowIndex === null || dragOverRowIndex === null) return;
            
            let newIndex = dragOverRowIndex;
            if (draggedRowIndex < newIndex) {
                newIndex--;
            }

            if (draggedRowIndex !== newIndex) {
                const item = state.splice(draggedRowIndex, 1)[0];
                state.splice(newIndex, 0, item);
                renderTable();
            }
            
            draggedRowIndex = null;
            dragOverRowIndex = null;
        }

        function handleRowDragEnd(e) {
            draggedRowIndex = null;
            dragOverRowIndex = null;
            renderTable(); 
        }

        // --- CORE DATA LOGIC --- //

        function handleCellEdit(rowIndex, colKey, el) {
            let text = el.innerText.trim();
            
            let parsedValue;
            if (text === "") {
                parsedValue = undefined; 
            } else if (text === "null") {
                parsedValue = null;
            } else if (text === "true") {
                parsedValue = true;
            } else if (text === "false") {
                parsedValue = false;
            } else {
                try {
                    parsedValue = JSON.parse(text); 
                } catch (e) {
                    parsedValue = text;
                }
            }

            if (parsedValue === undefined) {
                delete state[rowIndex][colKey];
            } else {
                state[rowIndex][colKey] = parsedValue;
            }
        }

        function handleKeydown(event, el) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                el.blur();
            }
        }

        function insertRow(index, positionOffset) {
            const newRow = {};
            columns.forEach(col => newRow[col] = ""); 
            state.splice(index + positionOffset, 0, newRow);
            renderTable();
        }

        function addRow() {
            insertRow(state.length, 0); 
        }

        function addColumn() {
            const newColName = prompt("Enter new column name:");
            if (newColName && newColName.trim() !== "") {
                const key = newColName.trim();
                if (!columns.includes(key)) {
                    state.forEach(row => row[key] = "");
                    renderTable();
                } else {
                    alert("Column already exists!");
                }
            }
        }

        function deleteRow(index) {
            if(confirm("Are you sure you want to delete this row?")) {
                state.splice(index, 1);
                renderTable();
            }
        }

        function exportJSON() {
            if (state.length === 0) {
                alert("Nothing to export!");
                return;
            }
            
            const dataStr = JSON.stringify(state, null, 2);
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            
            const anchor = document.getElementById('downloadAnchor');
            anchor.href = url;
            anchor.download = "export.json";
            anchor.click();
            
            URL.revokeObjectURL(url);
        }

        function exportCSV() {
            if (state.length === 0) {
                alert("Nothing to export!");
                return;
            }
            
            updateColumns();
            if (columns.length === 0) return;

            let csvContent = "";
            
            // 1. Generate Headers
            csvContent += columns.map(col => `"${String(col).replace(/"/g, '""')}"`).join(",") + "\n";
            
            // 2. Generate Rows
            state.forEach(row => {
                let rowArray = columns.map(col => {
                    let val = row[col];
                    if (val === undefined || val === null) {
                        return '""';
                    }
                    if (typeof val === 'object') {
                        val = JSON.stringify(val);
                    } else {
                        val = String(val);
                    }
                    // Escape internal quotes and wrap the whole value in quotes
                    val = val.replace(/"/g, '""');
                    return `"${val}"`;
                });
                csvContent += rowArray.join(",") + "\n";
            });

            const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
            const url = URL.createObjectURL(blob);
            
            const anchor = document.getElementById('downloadAnchor');
            anchor.href = url;
            anchor.download = "export.csv";
            anchor.click();
            
            URL.revokeObjectURL(url);
        }

        // Run initialization on load
        window.onload = init;
    </script>
</body>
</html>
